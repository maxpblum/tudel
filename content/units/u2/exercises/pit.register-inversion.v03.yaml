id: pit.register-inversion.v03
skills: [pit.register-inversion]
type: transform
difficulty: 3
title: Give the chords a soprano line
prompt: |
  The starter plays I, IV, V, I in C major with the default anchor, so the top
  voice sits on C5, C5, B4, C5. Make the top voice sing **E5, F5, D5, C5**
  instead, one note per bar. Change only the anchor, with one value per bar,
  and keep the default mode.
starter: |
  chord("<C F G C>").voicing().s("triangle")
hide_reference_code_until_reveal: true
solutions:
  - code: |
      chord("<C F G C>").anchor("<e5 f5 d5 c5>").voicing().s("triangle")
listen_for:
  - The top voice is now E5, F5, D5, C5, the anchor itself each bar, because each anchor is a chord tone
  - The bass follows from the voicing chosen, C4, A3, G3, E3
  - The C chords change inversion, root position in bar 1 and a 6/3 in bar 4, though only the soprano was specified
verify:
  cycles: 4
sources:
  - strudel-doc: anchor
  - strudel-src: "packages/tonal/tonleiter.mjs#L139-L169"
