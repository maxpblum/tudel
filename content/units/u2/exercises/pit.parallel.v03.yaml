id: pit.parallel.v03
skills: [pit.parallel]
type: spec-to-code
difficulty: 3
title: Fauxbourdon under a line
prompt: |
  Harmonise this line in **fauxbourdon**: under every note, add the diatonic
  fourth below and the diatonic sixth below, so every chord is a 6/3. Use one
  `add` with three values.

  The line, as degrees in C major with the tonic on C4: `"7 5 4 3 4 5 7@2"`
  (eighth notes, the last note a quarter).
hide_reference_code_until_reveal: true
solutions:
  - code: |
      n("7 5 4 3 4 5 7@2".add("0,-3,-5")).scale("C4:major").s("triangle")
listen_for:
  - The top voice is the line, from C5 down to F4 and back up to C5
  - The middle voice runs a fourth below it, G4 down to C4 and back
  - The bottom voice runs a sixth below the top, E4 down to A3 and back, so every chord is a 6/3
verify:
  cycles: 1
sources:
  - strudel-doc: add
  - strudel-doc: scale
