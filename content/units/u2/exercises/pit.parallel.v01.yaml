id: pit.parallel.v01
skills: [pit.parallel]
type: refactor
difficulty: 2
title: One line plus a third, not two lines
prompt: |
  The starter works, but its second line is just the first line two degrees
  higher, copied out by hand. Rewrite it as **one** degree line with `add`,
  so that a change to the tune changes both voices. It should sound exactly
  the same.
starter: |
  stack(
    n("0 1 2 3 4 2 1 0").scale("D4:major").s("triangle"),
    n("2 3 4 5 6 4 3 2").scale("D4:major").s("triangle"),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      n("0 1 2 3 4 2 1 0".add("0,2")).scale("D4:major").s("triangle")
  - code: |
      n("0 1 2 3 4 2 1 0").add(n("0,2")).scale("D4:major").s("triangle")
    note: >-
      Adding an n pattern to the n pattern gives the same events, because add
      combines the two n values. The reference keeps the interval inside the
      degree string, next to the line it belongs to.
listen_for:
  - The same eight two-note chords as the starter, in parallel thirds
  - The thirds are diatonic, major or minor as D major requires (D and F sharp, then E and G)
  - The code names the tune once and the interval once
verify:
  cycles: 1
sources:
  - strudel-doc: add
  - strudel-src: "packages/core/value.mjs#L10-L18"
