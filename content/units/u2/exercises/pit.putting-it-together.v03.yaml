id: pit.putting-it-together.v03
skills: [pit.putting-it-together]
type: creative
difficulty: 2
title: "Micro-burst: 3-tier rhythm section"
prompt: |
  Construct an original 4-bar groove at 110 BPM using `stack` with three
  interlocking frequency tiers:

  1. **Drums:** a multi-part drum groove on the Roland TR-808 (`bank("RolandTR808")`) with kick, snare, and hi-hats.
  2. **Bass:** a low harmonic anchor playing octave-3 roots (at or above C3) on a `"sawtooth"` synth, locking into the chord progression.
  3. **Chords:** a four-chord loop voiced with `chord(...).voicing()` on a `"triangle"` synth, balanced with `gain` so the harmony supports without overpowering the rhythm section.

  Choose your own key, chord progression, and rhythms. Check your groove against the rubric; the reference is one possible answer.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(110 / 4)
      stack(
        s("bd*2, ~ sd, hh*8").bank("RolandTR808"),
        note("<e3 c3 g3 d3>").s("sawtooth").gain(0.7),
        chord("<Em C G D>").voicing().s("triangle").gain(0.45),
      )
    note: "One possible groove in E minor. TR-808 drums anchor time, sawtooth bass outlines roots, and triangle chords voice the Em-C-G-D loop."
listen_for:
  - "In the reference, a punchy TR-808 drum beat establishes steady time"
  - "Low sawtooth bass roots move through E3, C3, G3, and D3"
  - "Warm triangle chords voice the 4-bar progression in the middle register"
rubric:
  - "Uses stack to layer drums, bassline, and voiced chord harmony"
  - "Drums use the RolandTR808 bank with kick, snare, and hi-hats"
  - "Bassline plays roots at or above C3 on a sawtooth wave"
  - "Chords are voiced using chord(...).voicing() on a triangle wave"
  - "All three parts are balanced with gain across a 4-bar loop"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: chord
  - strudel-doc: voicing
  - strudel-doc: bank
  - strudel-doc: gain
