id: pit.scale-degrees.v03
skills: [pit.scale-degrees]
type: transform
difficulty: 2
title: From note names to degrees, then a new key
prompt: |
  The starter plays a line in **E minor** with note names. Rewrite it as scale
  degrees with `n` and `.scale("E4:minor")`, and check that it sounds the same.
  Then move it to **A minor**, a fourth higher, by changing only the scale
  name to `"A4:minor"`. The reference shows the A minor version.
starter: |
  note("e4 g4 a4 b4 a4 g4 e4 d4").s("triangle")
hide_reference_code_until_reveal: true
solutions:
  - code: |
      n("0 2 3 4 3 2 0 -1").scale("A4:minor").s("triangle")
listen_for:
  - The same contour as the starter, a fourth higher, from A4 up to E5 and back
  - The last note is G4 (-1), a whole step below the tonic, because natural minor has no leading tone
  - Only the scale name differs from your E minor version; the numbers are identical
verify:
  cycles: 1
sources:
  - strudel-doc: n
  - strudel-doc: scale
