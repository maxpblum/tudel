id: pit.scale-degrees.v02
skills: [pit.scale-degrees]
type: ear-dictation
difficulty: 3
title: Hear the degrees in D major
prompt: |
  The target is one bar of eight eighth notes in **D major**, starting and
  ending on the tonic D4. Write it as scale degrees with `n` and
  `.scale("D4:major")`.

  The tune dips below the tonic before it climbs, so you will need negative
  numbers: -1 is the degree just below the tonic.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      n("0 -3 -1 0 2 4 2 0").scale("D4:major").s("triangle")
listen_for:
  - Note 2 drops a fourth from D4 to A3, the dominant below the tonic (-3)
  - Notes 3 and 4 climb back through the leading tone C sharp 4 (-1) to D4
  - The second half outlines the tonic triad, D4 F sharp 4 A4 F sharp 4, then back to D4
verify:
  cycles: 1
sources:
  - strudel-doc: n
  - strudel-doc: scale
