id: pit.putting-it-together.v02
skills: [pit.putting-it-together]
type: transform
difficulty: 2
title: "Voicing chords over a drum and bass rhythm"
prompt: |
  The starter gives an active drum beat and an eighth-note bassline in
  A minor (`<a3 f3 c3 g3>`). Add a chordal layer to the `stack`: the chord
  progression `<Am F C G>` voiced with `.voicing()`, played on `s("triangle")`
  at `gain(0.45)`.
starter: |
  setcpm(116 / 4)
  stack(
    s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR808"),
    note("<a3 f3 c3 g3>").ply(2).s("sawtooth").gain(0.6),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(116 / 4)
      stack(
        s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR808"),
        note("<a3 f3 c3 g3>").ply(2).s("sawtooth").gain(0.6),
        chord("<Am F C G>").voicing().s("triangle").gain(0.45),
      )
listen_for:
  - "Driving four-on-the-floor beat on the TR-808"
  - "Sawtooth bass repeating eighth notes on A3, F3, C3, and G3"
  - "Smoothly voiced chords sustaining the four-bar harmony above the rhythm section"
verify:
  cycles: 4
sources:
  - strudel-doc: stack
  - strudel-doc: chord
  - strudel-doc: voicing
  - strudel-doc: ply
