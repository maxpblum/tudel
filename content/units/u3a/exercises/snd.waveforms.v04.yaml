id: snd.waveforms.v04
skills: [snd.waveforms]
type: describe-to-code
difficulty: 2
title: A bright, buzzy bass
prompt: |
  The bass line **c3 c3 eb3 f3** in quarter notes should sound **bright** and
  **buzzy**, like a brass section playing low. Choose the waveform with the
  richest harmonic content. No filter yet.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      note("c3 c3 eb3 f3").s("sawtooth")
listen_for:
  - A rich, buzzy tone with every harmonic present
  - Clearly audible pitch in a low register, because the upper harmonics carry it
verify:
  cycles: 1
sources:
  - lexicon: bright
  - lexicon: buzzy
  - strudel-doc: s
