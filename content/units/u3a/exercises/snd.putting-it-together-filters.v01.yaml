id: snd.putting-it-together-filters.v01
skills: [snd.putting-it-together-filters]
type: transform
difficulty: 2
title: "Stepping filter cutoffs over a drum groove"
prompt: |
  The starter gives a 4-bar TR-909 drum groove. Add a sawtooth bass layer
  to the `stack`: octave-3 root notes `<c3 eb3 f3 g3>` repeating in quarter
  notes with `ply(4)`, stepping the lowpass filter cutoff up every bar using
  `.lpf("<400 800 1600 2400>")` at `gain(0.7)`.
starter: |
  setcpm(120 / 4)
  stack(s("bd ~ bd ~, ~ sd ~ sd, hh*8").bank("RolandTR909"))
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(120 / 4)
      stack(
        s("bd ~ bd ~, ~ sd ~ sd, hh*8").bank("RolandTR909"),
        note("<c3 eb3 f3 g3>")
          .ply(4)
          .s("sawtooth")
          .lpf("<400 800 1600 2400>")
          .gain(0.7),
      )
listen_for:
  - "Consistent TR-909 drum beat throughout"
  - "Sawtooth bass starts dark at 400 Hz in bar 1, then grows brighter each bar (800, 1600, 2400 Hz)"
  - "Bass steps through C3, E flat 3, F3, and G3"
verify:
  cycles: 4
sources:
  - strudel-doc: stack
  - strudel-doc: lpf
  - strudel-doc: ply
  - strudel-doc: bank
