id: snd.putting-it-together-filters.v03
skills: [snd.putting-it-together-filters]
type: creative
difficulty: 2
title: "Micro-burst: 4-bar filtered bass build"
prompt: |
  Compose an original 4-bar filtered groove at 120 BPM using `stack` with three
  sound design constraints:

  1. **Drums:** a multi-part drum groove on the Roland TR-909 (`bank("RolandTR909")`) with kick, snare, and hi-hats.
  2. **Bassline:** an octave-3 bassline (at or above C3) on a `"sawtooth"` synth, using `ply` to subdivide notes into a driving rhythm.
  3. **Filter motion:** a continuous 4-bar lowpass filter sweep on the bassline using `lpf` modulated by an LFO (such as `saw.range(...)`) slowed over four bars with `slow(4)`, balanced with `gain`.

  Choose your own bass notes, drum rhythm, and filter cutoff range. Check your groove against the rubric; the reference is one possible answer.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(120 / 4)
      stack(
        s("bd ~ bd ~, ~ sd ~ sd, hh*8").bank("RolandTR909"),
        note("<d3 c3 bb3 a3>")
          .ply(2)
          .s("sawtooth")
          .lpf(saw.range(400, 2000).slow(4))
          .gain(0.7),
      )
    note: "One possible groove. TR-909 drums anchor time, and a pulsing sawtooth bass sweeps its lowpass filter from 400 Hz to 2000 Hz over 4 bars."
listen_for:
  - "In the reference, a punchy TR-909 drum beat anchors the groove"
  - "Low sawtooth bass roots move through D3, C3, B flat 3, and A3"
  - "Lowpass cutoff climbs steadily from 400 Hz to 2000 Hz over the 4-bar phrase"
rubric:
  - "Combines a drum groove and a filtered bassline in a single stack"
  - "Drums use the RolandTR909 bank with kick, snare, and hi-hats"
  - "Bassline plays notes at or above C3 on a sawtooth wave with rhythmic repetition using ply"
  - "Lowpass filter cutoff modulates across a 4-bar sweep using lpf and slow(4)"
  - "Relative levels are balanced with gain so the bass does not drown the drums"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: lpf
  - strudel-doc: saw
  - strudel-doc: range
  - strudel-doc: bank
  - strudel-doc: ply
  - strudel-doc: slow
  - strudel-doc: gain
