id: snd.putting-it-together-filters.v02
skills: [snd.putting-it-together-filters]
type: creative
difficulty: 2
title: "Continuous 4-bar saw sweep on an eighth-note bass"
prompt: |
  The starter gives four-on-the-floor drums and a bassline filtered with a
  static cutoff. Modify the bass filter to build continuous phrase tension:

  1. Replace the static `lpf` cutoff with an LFO sweep that rises continuously over 4 bars using `saw.range(...)` and `slow(4)`.
  2. Add resonance with `lpq` so the sweeping harmonic peak is clearly audible.

  Choose your own sweep frequency range and resonance level. Check your modification against the rubric; the reference is one possible answer.
starter: |
  setcpm(120 / 4)
  stack(
    s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR808"),
    note("<a3 f3 c3 g3>").ply(2).s("sawtooth").lpf(500).gain(0.65),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(120 / 4)
      stack(
        s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR808"),
        note("<a3 f3 c3 g3>")
          .ply(2)
          .s("sawtooth")
          .lpf(saw.range(300, 2200).slow(4))
          .lpq(3)
          .gain(0.65),
      )
    note: "One possible sweep. A rising sawtooth LFO sweep from 300 to 2200 Hz with lpq(3) resonance over 4 bars."
listen_for:
  - "In the reference, the bass cutoff sweeps smoothly upward across all 4 bars"
  - "A resonant peak (lpq 3) gives the rising harmonics distinct vocal character"
  - "The filter snaps back dark at the downbeat of bar 1"
rubric:
  - "Replaces static filter with a continuous 4-bar lowpass sweep using lpf, saw.range, and slow(4)"
  - "Adds audible resonance with lpq"
  - "Leaves the drum groove and bass pitch sequence intact"
  - "Bass level stays balanced with gain"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: lpf
  - strudel-doc: lpq
  - strudel-doc: saw
  - strudel-doc: range
  - strudel-doc: slow
