id: snd.lowpass.v02
skills: [snd.lowpass]
type: describe-to-code
difficulty: 2
title: A warm, dark pad chord
prompt: |
  Hold a C minor triad **c3, eb3, g3** for a whole bar on a sawtooth, but make
  it **warm** and **dark**: keep the body, round off the buzzy top. Use only a
  low-pass, no resonance.

  Any cutoff from about 500 to 1000 Hz fits the description. The reference
  uses one value in that range.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      note("c3,eb3,g3").s("sawtooth").lpf(700)
listen_for:
  - All three chord tones sound together for the full bar
  - Full low and middle register, but no buzzy edge on top
  - No whistle at the cutoff (no added resonance)
verify:
  cycles: 1
sources:
  - lexicon: warm
  - lexicon: dark
  - strudel-doc: lpf
  - lexicon: buzzy
  - lexicon: thin
  - lexicon: resonant
  - lexicon: pad-like
