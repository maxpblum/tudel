id: snd.highpass.v04
skills: [snd.highpass]
type: match-by-ear
difficulty: 2
title: Low-pass or high-pass?
prompt: |
  Listen to the target: the arpeggio **c3 eb3 g3 c4** on a sawtooth through
  one filter. Is it a low-pass or a high-pass, and roughly where is the cutoff?
  Write it.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      note("c3 eb3 g3 c4").s("sawtooth").hpf(1200)
listen_for:
  - The top is still bright and buzzy, so the highs were not removed
  - The low notes have lost their weight, so it is a high-pass
  - A high cutoff, well above every fundamental in the arpeggio
verify:
  cycles: 1
sources:
  - strudel-doc: hpf
  - lexicon: thin
  - lexicon: bright
  - lexicon: buzzy
