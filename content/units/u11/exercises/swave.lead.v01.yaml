id: swave.lead.v01
skills: [swave.lead]
type: match-by-ear
difficulty: 4
title: Match the lead over E minor
prompt: |
  The notes of this four-bar lead at **95 BPM** are given, one `< >` step
  per bar: `"<[b4@3 d5] [e5@2 d5 b4] [d5@2 a4 g4] [a4@2 ~@2]>"`. Recreate
  its **sound** by ear. Listen for:

  - how many voices you hear and how much they beat (it is a `"supersaw"`)
  - the vibrato: its speed in Hz and its depth in cents
  - how the notes start and end, and how bright they are
  - the echo: its rhythm and how many repeats you can count
  - the reverb: how long the tail lasts after bar 4

  Put it on orbit 3, as the lessons' leads are.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(95 / 4)
      note("<[b4@3 d5] [e5@2 d5 b4] [d5@2 a4 g4] [a4@2 ~@2]>")
        .s("supersaw")
        .unison(2)
        .detune(0.1)
        .vib(5)
        .vibmod(0.1)
        .attack(0.05)
        .release(0.5)
        .lpf(2600)
        .orbit(3)
        .delay(0.4)
        .delaysync(3 / 16)
        .delayfeedback(0.45)
        .room(0.4)
        .roomsize(5)
        .gain(0.5)
listen_for:
  - "Two voices 10 cents apart (unison 2, detune 0.1): a slow beating, but a clear pitch"
  - "Vibrato about 5 Hz, ±10 cents (vib 5, vibmod 0.1); a low-pass around 2600 Hz"
  - "Echo feedback 0.45: four or five audible repeats; a hall of about 5 seconds (roomsize 5, room 0.4)"
  - "Long notes: B4 for three beats, then D5; E5 D5 B4; D5 A4 G4; A4 and a half-bar rest"
  - "Notes start like a breath (no click), with a gentle, even vibrato"
  - "Echoes a dotted eighth (about 0.47 seconds at 95 BPM) after each note, falling between the beats"
  - "The rest at the end of bar 4 is filled by echoes and a long reverb tail"
verify:
  cycles: 4
sources:
  - strudel-doc: vib
  - strudel-doc: vibmod
  - strudel-doc: delaysync
  - strudel-doc: delayfeedback
  - strudel-doc: roomsize
  - lexicon: wet
