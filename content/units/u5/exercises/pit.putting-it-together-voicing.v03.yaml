id: pit.putting-it-together-voicing.v03
skills: [pit.putting-it-together-voicing]
type: creative
difficulty: 2
title: "Micro-burst: extended seventh-chord groove"
prompt: |
  Compose an original 4-bar groove at 112 BPM using `stack` with three tiers:

  1. **Rhythm:** a drum groove on a vintage drum bank (such as `bank("RolandTR808")`), featuring kick, backbeat snare, and subdivided hi-hats.
  2. **Bass:** a low bassline playing root notes at or above C3 on `"sawtooth"`, filtered with `lpf` to sit cleanly below the chords.
  3. **Extended chords:** a 4-bar progression of extended seventh chords voiced with `chord(...).voicing()` on a pad synth (such as `"supersaw"` with `detune`, or `"triangle"`), balanced with `gain` so the harmony enriches the groove without overpowering it.

  Choose your own chord progression, rhythms, and voicing timbres. Check your groove against the rubric; the reference is one possible answer.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(112 / 4)
      stack(
        s("bd ~ bd ~, ~ sd ~ sd, hh*16").bank("RolandTR808"),
        note("<c3 a3 f3 g3>").s("sawtooth").lpf(500).gain(0.7),
        chord("<C^7 Am7 F^7 G>")
          .voicing()
          .s("supersaw")
          .detune(0.15)
          .lpf(2000)
          .gain(0.35),
      )
    note: "One possible groove. TR-808 drums with sixteenth hats, filtered sawtooth bass, and detuned supersaw seventh chords in C major."
listen_for:
  - "In the reference, sixteenth-note hats ride over the TR-808 backbeat"
  - "Warm, rounded bass notes anchor C3, A3, F3, and G3"
  - "Lush major and minor seventh voicings create smooth, sophisticated harmony"
rubric:
  - "Combines rhythm, bass, and extended chord voicings in stack"
  - "Uses 7th chords voiced with chord(...).voicing()"
  - "Sawtooth bass plays root notes at or above C3, filtered with lpf"
  - "Drums use a drum machine sound bank (such as RolandTR808) with kick, snare, and hats"
  - "Gain levels are properly balanced across the three tiers"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: chord
  - strudel-doc: voicing
  - strudel-doc: detune
  - strudel-doc: lpf
  - strudel-doc: bank
  - strudel-doc: gain
