id: pit.putting-it-together-voicing.v02
skills: [pit.putting-it-together-voicing]
type: transform
difficulty: 2
title: "Locking a sawtooth bassline beneath extended chords"
prompt: |
  The starter gives a TR-808 groove and voiced seventh chords in A minor
  (`<Am7 F^7 C^7 G>`). Add a root bassline to the `stack`: octave-3
  roots `<a3 f3 c3 g3>` repeated in eighth notes with `.ply(2)` on
  `s("sawtooth")`, filtered with `.lpf(550)` at `gain(0.7)`.
starter: |
  setcpm(116 / 4)
  stack(
    s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR808"),
    chord("<Am7 F^7 C^7 G>")
      .voicing()
      .s("supersaw")
      .detune(0.15)
      .lpf(2000)
      .gain(0.35),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(116 / 4)
      stack(
        s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR808"),
        note("<a3 f3 c3 g3>").ply(2).s("sawtooth").lpf(550).gain(0.7),
        chord("<Am7 F^7 C^7 G>")
          .voicing()
          .s("supersaw")
          .detune(0.15)
          .lpf(2000)
          .gain(0.35),
      )
listen_for:
  - "Four-on-the-floor TR-808 rhythm section"
  - "Warm sawtooth bass outlining A3, F3, C3, and G3 roots below 550 Hz"
  - "Lush, shimmering seventh chord voicings floating in the upper register"
verify:
  cycles: 4
sources:
  - strudel-doc: stack
  - strudel-doc: chord
  - strudel-doc: voicing
  - strudel-doc: lpf
  - strudel-doc: ply
