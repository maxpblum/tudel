id: pit.putting-it-together-voicing.v02
skills: [pit.putting-it-together-voicing]
type: creative
difficulty: 2
title: "Locking a sawtooth bassline beneath extended chords"
prompt: |
  The starter gives a TR-808 groove and voiced seventh chords in A minor.
  Add a bass foundation to the `stack`:

  1. Play the chord roots in octave 3 (at or above C3) on `"sawtooth"`.
  2. Give the bass rhythmic motion using subdivided mini-notation (such as `*2` or `*4`).
  3. Filter the bass with `lpf` to tame higher harmonics, leaving space for the rich supersaw chords.
  4. Balance the bass level with `gain`.

  Choose your own rhythm and filter cutoff. Check your addition against the rubric; the reference is one possible answer.
starter: |
  setcpm(116 / 4)
  stack(
    s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR808"),
    chord("<Am7 F^7 C^7 G>")
      .voicing()
      .s("supersaw")
      .detune(0.15)
      .lpf(2000)
      .gain(0.35),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(116 / 4)
      stack(
        s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR808"),
        note("<a3*2 f3*2 c3*2 g3*2>").s("sawtooth").lpf(550).gain(0.7),
        chord("<Am7 F^7 C^7 G>")
          .voicing()
          .s("supersaw")
          .detune(0.15)
          .lpf(2000)
          .gain(0.35),
      )
    note: "One possible bassline. Eighth-note sawtooth roots filtered at 550 Hz anchoring the seventh chords."
listen_for:
  - "In the reference, rounded sawtooth bass notes anchor A3, F3, C3, and G3"
  - "The lowpass filter at 550 Hz keeps the bass warm without masking the supersaw pad"
  - "TR-808 drums drive the groove steadily"
rubric:
  - "Adds a sawtooth bassline to the stack"
  - "Follows the root motion of the chord progression at or above C3"
  - "Filters the bassline with lpf"
  - "Uses rhythmic subdivision to lock into the groove"
  - "Balances gain across drums, bass, and pads"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: note
  - strudel-doc: lpf
  - strudel-doc: gain
