id: mod.signal-melody.v01
skills: [mod.signal-melody]
type: dictation
difficulty: 3
title: An arch in thirds
prompt: |
  Write this bar as **one stepped signal turned into scale degrees** of C
  major, with the scale's degree 0 on c4. Use a triangle wave.

  Hint: write down the degree of each note first (c4 is 0). Which of the six
  signal shapes rises and falls in straight lines?
abc: |
  X:1
  M:4/4
  L:1/8
  K:C
  C E G B d B G E |
hide_reference_code_until_reveal: true
solutions:
  - code: |
      n(tri.range(0, 8).segment(8)).scale("C4:major").s("triangle")
  - code: |
      n(tri.segment(8).range(0, 8)).scale("C4:major").s("triangle")
    note: Sampling first and then ranging gives the same degrees, because range only rescales the sampled values. Ranging first reads more naturally ("a 0 to 8 arch, in eight steps").
listen_for:
  - "Degrees 0, 2, 4, 6, 8, 6, 4, 2: tri sampled at 0, ¼, ½, ¾, 1, ¾, ½, ¼ and multiplied by 8"
  - Eight even eighth notes rising in thirds to d5 on beat 3, then falling back
  - The arch starts again on c4 every bar
verify:
  cycles: 1
  abc_agreement:
    voice: 0
    compare: [pitch, onset, duration]
sources:
  - strudel-doc: tri
  - strudel-doc: segment
  - strudel-doc: scale
