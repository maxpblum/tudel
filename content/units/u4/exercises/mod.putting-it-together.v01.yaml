id: mod.putting-it-together.v01
skills: [mod.putting-it-together]
type: creative
difficulty: 2
title: "Adding a rhythmic tremolo to a sweeping synth pad"
prompt: |
  The starter gives a drum beat and a chord pad sweeping its lowpass filter
  over 4 bars. Add rhythmic motion to the pad by modulating its amplitude:

  1. Replace the fixed `gain` with a beat-synced tremolo using an LFO (such as `sine` or `saw`) accelerated with `fast`.
  2. Scale the modulation range using `range` so the volume pulses rhythmically without dropping to complete silence.

  Choose your own LFO shape and modulation depth. Check your addition against the rubric; the reference is one possible answer.
starter: |
  setcpm(120 / 4)
  stack(
    s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR909"),
    chord("<Am F C G>")
      .voicing()
      .s("sawtooth")
      .lpf(saw.range(400, 2600).slow(4))
      .gain(0.55),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(120 / 4)
      stack(
        s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR909"),
        chord("<Am F C G>")
          .voicing()
          .s("sawtooth")
          .lpf(saw.range(400, 2600).slow(4))
          .gain(sine.range(0.35, 0.75).fast(4)),
      )
    note: "One possible tremolo. Fast sine LFO pulsing between 0.35 and 0.75 gain on every quarter note."
listen_for:
  - "In the reference, the sweeping pad pulses rapidly in loudness on each quarter note"
  - "The long 4-bar lowpass filter sweep continues rising smoothly underneath the tremolo"
  - "Drums drive the 4/4 pulse steadily"
rubric:
  - "Modulates pad gain with an LFO accelerated by fast"
  - "Uses range to keep the minimum volume audible"
  - "Preserves the 4-bar lowpass filter sweep on the pad"
  - "Leaves the drum groove intact"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: gain
  - strudel-doc: sine
  - strudel-doc: range
  - strudel-doc: fast
