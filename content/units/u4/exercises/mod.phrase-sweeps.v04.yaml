id: mod.phrase-sweeps.v04
skills: [mod.phrase-sweeps, mod.range]
type: describe-to-code
difficulty: 3
title: Thinning out across the build
prompt: |
  An eight-bar build on the chord **c3, g3, eb4**, played as half notes on a
  sawtooth. Across the eight bars the sound grows steadily **thinner**: the
  low end is cut away from below, a little more each bar, by a high-pass whose
  cutoff rises from **100 Hz** to **1600 Hz**, one octave every two bars. On
  the downbeat of bar 9 the full sound returns, and the build starts again.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      note("[c3,g3,eb4]*2").s("sawtooth").hpf(saw.rangex(100, 1600).slow(8))
listen_for:
  - Full in bar 1, noticeably thinner by bar 5 (400 Hz), thin by bar 8, with c3 almost gone
  - Every two bars the high-pass cutoff doubles (100, 200, 400, 800 Hz on the downbeats of bars 1, 3, 5 and 7), so the thinning is even
  - The full chord returns at once on the downbeat of bar 9
verify:
  cycles: 16
sources:
  - strudel-doc: hpf
  - strudel-doc: rangex
  - strudel-doc: slow
  - lexicon: thin
