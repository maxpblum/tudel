id: mod.putting-it-together.v03
skills: [mod.putting-it-together]
type: creative
difficulty: 2
title: "Micro-burst: multi-speed modulation on a 4-bar groove"
prompt: |
  Create an original 4-bar soundscape at 116 BPM using `stack` with two
  simultaneous speeds of continuous modulation:

  1. **Drums:** a steady beat on a drum machine sound bank (such as `bank("RolandTR909")`), providing a rhythmic anchor.
  2. **Macro-motion (phrase sweep):** a synth voice (such as bass on `"sawtooth"`) whose lowpass filter cutoff slowly evolves across the 4-bar phrase using `lpf` modulated by an LFO with `slow(4)`.
  3. **Meso-motion (rhythmic tremolo):** a faster, beat-synced volume modulation applied to the synth voice using `gain` modulated by an LFO with `fast`.

  Choose your own notes, waveforms, and modulation ranges. Check your soundscape against the rubric; the reference is one possible answer.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(116 / 4)
      stack(
        s("bd ~ bd ~, ~ sd ~ sd, hh*8").bank("RolandTR909"),
        note("<d3 bb3 f3 c3>")
          .ply(2)
          .s("sawtooth")
          .lpf(saw.range(400, 2400).slow(4))
          .gain(sine.range(0.4, 0.75).fast(4)),
      )
    note: "One possible soundscape. A 4-bar phrase sweep on filter cutoff combines with a quarter-note tremolo on bass gain over TR-909 drums."
listen_for:
  - "In the reference, a steady TR-909 drum beat anchors 4/4 time"
  - "Eighth-note bassline pulses in volume on every beat from the fast sine tremolo"
  - "Overall lowpass filter opens steadily across the 4-bar chord cycle"
rubric:
  - "Combines steady drums with dual-speed continuous modulation in stack"
  - "Macro-motion: a slow 4-bar phrase sweep on filter cutoff using lpf and slow(4)"
  - "Meso-motion: a faster rhythmic modulation on volume using gain and fast"
  - "All pitched notes stay at or above C3"
  - "Drums provide a steady reference tempo"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: lpf
  - strudel-doc: saw
  - strudel-doc: sine
  - strudel-doc: fast
  - strudel-doc: slow
  - strudel-doc: bank
  - strudel-doc: gain
