id: spop.pads.v03
skills: [spop.pads]
type: match-by-ear
difficulty: 3
title: The moving bed
prompt: |
  Listen to the reference: an arpeggiated bed over **D minor, B flat, F,
  C** at **120 BPM**, one chord per bar, taken from `chord(...).voicing()`
  with the default settings. Recreate it: which voicing positions does
  `arp` play, in what rhythm, and how is each note shaped?
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(120 / 4)
      chord("<Dm Bb F C>")
        .voicing()
        .arp("[0 1 2 3]*2")
        .s("square")
        .decay(0.15)
        .sustain(0)
        .lpf(1800)
        .delay(0.3)
        .delaysync(3 / 16)
        .gain(0.5)
listen_for:
  - "Eighth notes running up the lowest four voices of each chord, twice per bar"
  - "Bar 1: D3 A3 D4 F4 twice; bar 3: F3 C4 F4 A4 twice"
  - "Short plucked notes with dotted-eighth echoes filling the gaps"
verify:
  cycles: 4
sources:
  - strudel-doc: arp
  - strudel-doc: delaysync
  - lexicon: plucky
