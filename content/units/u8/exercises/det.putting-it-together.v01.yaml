id: det.putting-it-together.v01
skills: [det.putting-it-together]
type: transform
difficulty: 2
title: "Adding a vibrato lead synth over a full electronic mix"
prompt: |
  The starter provides a TR-909 beat, low sawtooth bass, and shimmering
  supersaw chords. Add a lead melody to the top of the `stack`:
  `n("<[4@2 5 7] [5@2 4 2] [0@2 2 4] [2@3 ~]>")` scaled to `"A4:minor"`,
  played on `s("square")` with vibrato `.vib(6).vibmod(0.25)` at `.gain(0.3)`.
starter: |
  setcpm(120 / 4)
  stack(
    s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR909").gain(0.85),
    note("<a3 f3 c3 g3>").ply(2).s("sawtooth").lpf(450).gain(0.7),
    chord("<Am F C G>").voicing().s("supersaw").detune(0.2).lpf(2000).gain(0.35),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(120 / 4)
      stack(
        s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR909").gain(0.85),
        note("<a3 f3 c3 g3>").ply(2).s("sawtooth").lpf(450).gain(0.7),
        chord("<Am F C G>").voicing().s("supersaw").detune(0.2).lpf(2000).gain(0.35),
        n("<[4@2 5 7] [5@2 4 2] [0@2 2 4] [2@3 ~]>")
          .scale("A4:minor")
          .s("square")
          .vib(6)
          .vibmod(0.25)
          .gain(0.3),
      )
listen_for:
  - "Full, driving TR-909 rhythm and solid low-pass filtered bass"
  - "Wide detuned supersaw chords filling out the harmonic background"
  - "Square-wave lead melody singing cleanly over the mix with expressive 6 Hz pitch vibrato"
verify:
  cycles: 4
sources:
  - strudel-doc: stack
  - strudel-doc: vib
  - strudel-doc: vibmod
  - strudel-doc: s
  - strudel-doc: detune
