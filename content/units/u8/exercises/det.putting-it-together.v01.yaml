id: det.putting-it-together.v01
skills: [det.putting-it-together]
type: creative
difficulty: 2
title: "Adding a vibrato lead synth over a full electronic mix"
prompt: |
  The starter provides a TR-909 beat, low sawtooth bass, and shimmering
  supersaw chords in A minor. Add a melodic lead to the top of the `stack`:

  1. Write a lead melody in A minor using `n(...)` with `scale("A4:minor")` (or direct notes at or above C4) on `"square"` or `"sawtooth"`.
  2. Add expressive pitch vibrato using `vib` and `vibmod`.
  3. Balance the lead with `gain` so it sings above the chords and bass without pushing the composite mix into clipping.

  Choose your own melodic contour and vibrato settings. Check your addition against the rubric; the reference is one possible answer.
starter: |
  setcpm(120 / 4)
  stack(
    s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR909").gain(0.85),
    note("<a3 f3 c3 g3>").ply(2).s("sawtooth").lpf(450).gain(0.7),
    chord("<Am F C G>").voicing().s("supersaw").detune(0.2).lpf(2000).gain(0.35),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(120 / 4)
      stack(
        s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR909").gain(0.85),
        note("<a3 f3 c3 g3>").ply(2).s("sawtooth").lpf(450).gain(0.7),
        chord("<Am F C G>").voicing().s("supersaw").detune(0.2).lpf(2000).gain(0.35),
        n("<[4@2 5 7] [5@2 4 2] [0@2 2 4] [2@3 ~]>")
          .scale("A4:minor")
          .s("square")
          .vib(6)
          .vibmod(0.25)
          .gain(0.3),
      )
    note: "One possible lead melody. A square lead in A minor with vib(6) and vibmod(0.25) vibrato at gain(0.3)."
listen_for:
  - "In the reference, a bright square lead enters above the supersaw pad"
  - "Continuous vibrato gives sustained notes expressive warmth"
  - "The composite mix remains clear and uncluttered"
rubric:
  - "Adds a lead melody to the stack in A minor"
  - "Applies vibrato using vib and vibmod"
  - "All melody notes sit at or above C4"
  - "Lead gain is staged properly so the mix does not clip"
  - "Leaves the starter drum, bass, and pad layers intact"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: vib
  - strudel-doc: vibmod
  - strudel-doc: scale
  - strudel-doc: gain
