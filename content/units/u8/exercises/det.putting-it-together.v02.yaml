id: det.putting-it-together.v02
skills: [det.putting-it-together]
type: creative
difficulty: 2
title: "Adding a detuned supersaw pad to a rhythm and lead mix"
prompt: |
  The starter gives drums, an eighth-note bassline in D minor, and a lead
  melody. Add a harmonic pad in the middle of the `stack` to fill the space
  between the bass and the lead:

  1. Voice a 4-bar chord progression in D minor using `chord(...).voicing()`.
  2. Play it on `"supersaw"`, with `detune` to create a wide stereo chorus.
  3. Filter the high frequencies with `lpf` so the pad stays warm and doesn't clash with the lead.
  4. Balance its level with `gain`.

  Choose your own chord progression and detune depth. Check your addition against the rubric; the reference is one possible answer.
starter: |
  setcpm(120 / 4)
  stack(
    s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR909").gain(0.85),
    note("<d3 bb3 f3 c3>").ply(2).s("sawtooth").lpf(450).gain(0.7),
    n("<0 2 3 5 7 5 3 2>")
      .scale("D5:minor")
      .s("square")
      .vib(6)
      .vibmod(0.2)
      .gain(0.3),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(120 / 4)
      stack(
        s("bd*4, ~ sd ~ sd, hh*8").bank("RolandTR909").gain(0.85),
        note("<d3 bb3 f3 c3>").ply(2).s("sawtooth").lpf(450).gain(0.7),
        chord("<Dm Bb F C>").voicing().s("supersaw").detune(0.2).lpf(1800).gain(0.35),
        n("<0 2 3 5 7 5 3 2>")
          .scale("D5:minor")
          .s("square")
          .vib(6)
          .vibmod(0.2)
          .gain(0.3),
      )
    note: "One possible harmonic pad. Detuned supersaw pad (<Dm Bb F C>) filtered at 1800 Hz sitting between bass and lead."
listen_for:
  - "In the reference, wide detuned supersaw chords fill the harmonic middle register"
  - "The lowpass filter at 1800 Hz prevents the pad from masking the square lead"
  - "The drum and bass foundation remains punchy and clear"
rubric:
  - "Adds a harmonic pad to the stack using chord(...).voicing()"
  - "Uses supersaw with detune for chorused width"
  - "Filters the pad with lpf to prevent clash with the lead"
  - "Pad gain is staged so the overall mix remains balanced"
  - "Leaves the starter drum, bass, and lead tracks intact"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: chord
  - strudel-doc: voicing
  - strudel-doc: detune
  - strudel-doc: lpf
  - strudel-doc: gain
