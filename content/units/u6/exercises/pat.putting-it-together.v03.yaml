id: pat.putting-it-together.v03
skills: [pat.putting-it-together]
type: creative
difficulty: 2
title: "Micro-burst: polyphonic derived arrangement in D minor"
prompt: |
  Compose a 4-bar groove at 116 BPM using pattern transforms to derive
  rich counterpoint from minimal code:

  1. **Dynamic drums:** a TR-909 beat with an automatic cadence fill on the fourth bar using `.lastOf(4, (x) => x.ply(2))`.
  2. **Bass foundation:** octave-3 root notes `<d3 bb3 f3 c3>` on `s("sawtooth")` at `gain(0.7)`.
  3. **Polyphonic melody:** seed motif `n("0 2 4 7 5 3 2 0").scale("D4:minor")` layered with an octave-higher retrograde countermelody using `.superimpose((x) => x.add(note(12)).rev())` on `s("triangle")` at `gain(0.4)`.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(116 / 4)
      stack(
        s("bd ~ bd ~, ~ sd ~ sd, hh*8")
          .bank("RolandTR909")
          .lastOf(4, (x) => x.ply(2)),
        note("<d3 bb3 f3 c3>").s("sawtooth").gain(0.7),
        n("0 2 4 7 5 3 2 0")
          .scale("D4:minor")
          .superimpose((x) => x.add(note(12)).rev())
          .s("triangle")
          .gain(0.4),
      )
listen_for:
  - "Drums keep steady eighth time, then double to sixteenth notes on bar 4"
  - "Low roots D3, B flat 3, F3, and C3 driving the harmonic progression"
  - "Forward melody in octave 4 intertwining seamlessly with reverse melody in octave 5"
rubric:
  - "Combines steady rhythm with algorithmic variation on melody or harmony"
  - "Uses every(4, rev) or similar transformation to create phrase cadence on bar 4"
  - "Bassline tracks roots in octave 3 (at or above C3)"
  - "Drums maintain steady groove throughout"
  - "Relative gain balances allow the transformed melody to stand out"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: superimpose
  - strudel-doc: lastOf
  - strudel-doc: ply
  - strudel-doc: scale
