id: pat.putting-it-together.v01
skills: [pat.putting-it-together]
type: transform
difficulty: 2
title: "Deriving an octave countermelody with superimpose"
prompt: |
  The starter gives a TR-909 drum beat, bass, and an 8-note melody in
  C major. Use `.superimpose` on the melody to layer a second voice that
  is transposed an octave higher and played in reverse:
  `.superimpose((x) => x.add(note(12)).rev())`.
starter: |
  setcpm(116 / 4)
  stack(
    s("bd ~ bd ~, ~ sd ~ sd, hh*8").bank("RolandTR909"),
    note("<c3 a3 f3 g3>").s("sawtooth").gain(0.65),
    n("0 2 4 5 7 5 4 2").scale("C4:major").s("triangle").gain(0.45),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(116 / 4)
      stack(
        s("bd ~ bd ~, ~ sd ~ sd, hh*8").bank("RolandTR909"),
        note("<c3 a3 f3 g3>").s("sawtooth").gain(0.65),
        n("0 2 4 5 7 5 4 2")
          .scale("C4:major")
          .superimpose((x) => x.add(note(12)).rev())
          .s("triangle")
          .gain(0.45),
      )
listen_for:
  - "Steady TR-909 beat and low bassline in the lower octaves"
  - "The original C-major melody climbing forward in octave 4"
  - "The superimposed countermelody descending backward in octave 5 at the same time"
verify:
  cycles: 4
sources:
  - strudel-doc: stack
  - strudel-doc: superimpose
  - strudel-doc: rev
  - strudel-doc: add
  - strudel-doc: scale
