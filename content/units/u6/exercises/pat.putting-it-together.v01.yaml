id: pat.putting-it-together.v01
skills: [pat.putting-it-together]
type: creative
difficulty: 2
title: "Deriving an octave countermelody with superimpose"
prompt: |
  The starter gives a TR-909 drum beat, bass, and a melody in C major.
  Derive a polyphonic countermelody using pattern transformations:

  1. Use `superimpose` on the melodic line to layer a second simultaneous voice without duplicating code.
  2. Transform the derived voice with transposition (such as `add(note(12))` or `add(note(7))`) or rhythmic alteration (such as `rev`).

  Choose your own transformation function. Check your addition against the rubric; the reference is one possible answer.
starter: |
  setcpm(116 / 4)
  stack(
    s("bd ~ bd ~, ~ sd ~ sd, hh*8").bank("RolandTR909"),
    note("<c3 a3 f3 g3>").s("sawtooth").gain(0.65),
    n("0 2 4 5 7 5 4 2").scale("C4:major").s("triangle").gain(0.45),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(116 / 4)
      stack(
        s("bd ~ bd ~, ~ sd ~ sd, hh*8").bank("RolandTR909"),
        note("<c3 a3 f3 g3>").s("sawtooth").gain(0.65),
        n("0 2 4 5 7 5 4 2")
          .scale("C4:major")
          .superimpose((x) => x.add(note(12)).rev())
          .s("triangle")
          .gain(0.45),
      )
    note: "One possible countermelody. An octave-higher retrograde voice derived with superimpose((x) => x.add(note(12)).rev())."
listen_for:
  - "In the reference, the main melody in octave 4 intertwines with a retrograde countermelody in octave 5"
  - "The two voices move in opposite directions, creating rich classical counterpoint"
  - "The drum and bass foundation stays solid underneath"
rubric:
  - "Applies superimpose to derive a countermelody from the lead line"
  - "Transforms the superimposed voice with transposition (add) or temporal reversal (rev)"
  - "All pitches remain at or above C3"
  - "Leaves the starter drum and bass tracks intact"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: superimpose
  - strudel-doc: add
  - strudel-doc: note
  - strudel-doc: rev
  - strudel-doc: gain
