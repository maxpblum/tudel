id: snd.putting-it-together-space.v03
skills: [snd.putting-it-together-space]
type: creative
difficulty: 2
title: "Micro-burst: 3D spatial mix with FM plucks"
prompt: |
  Compose a 4-bar groove at 116 BPM that creates clear front-to-back depth:

  1. **Foreground anchor:** dry drums on the TR-808 (`s("bd*2, ~ sd, hh*8")`) and sawtooth bass on `<d3 c3 bb3 a3>`.
  2. **Metallic timbre:** an FM pluck on `s("sine")` using `.fmi(3.5).fmh(2)` with `.decay(0.15).sustain(0)`.
  3. **Spatial depth:** give the FM melody a synced delay `.delay(0.35).delaysync(3 / 16)` and room wash `.room(0.4)` at `.gain(0.45)`.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(116 / 4)
      stack(
        s("bd*2, ~ sd, hh*8").bank("RolandTR808"),
        note("<d3 c3 bb3 a3>").s("sawtooth").gain(0.65),
        note("<f4 a4 c5 e5>")
          .s("sine")
          .fmi(3.5)
          .fmh(2)
          .decay(0.15)
          .sustain(0)
          .delay(0.35)
          .delaysync(3 / 16)
          .room(0.4)
          .gain(0.45),
      )
listen_for:
  - "Punchy, completely dry rhythm section upfront"
  - "Distinct metallic bell chime on F4, A4, C5, and E5"
  - "Echoes and reverberant tail placing the melody in a wide virtual acoustic room"
rubric:
  - "Combines dry rhythm tracks with wet, spaced lead tracks in stack"
  - "Rhythm section stays upfront and dry (no room or delay on drums and bass)"
  - "Lead melody uses FM synthesis parameters fmi and fmh on sine wave"
  - "Lead melody is placed in the background using delay, delaysync, or room"
  - "All pitches are at or above C3"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: fmi
  - strudel-doc: fmh
  - strudel-doc: delay
  - strudel-doc: room
