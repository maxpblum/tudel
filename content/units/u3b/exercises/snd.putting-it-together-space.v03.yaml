id: snd.putting-it-together-space.v03
skills: [snd.putting-it-together-space]
type: creative
difficulty: 2
title: "Micro-burst: 3D spatial mix with FM plucks"
prompt: |
  Compose an original 4-bar groove at 116 BPM using `stack` that establishes
  clear front-to-back spatial depth:

  1. **Foreground anchor:** a dry rhythm section combining a drum machine bank (such as `bank("RolandTR808")`) and an octave-3 `"sawtooth"` bass, kept completely dry with no delay or reverb.
  2. **Metallic timbre:** a plucked melodic line using FM synthesis on `s("sine")`, shaped with `fmi` and `fmh` and a short percussive envelope (`decay` and zero `sustain`).
  3. **Spatial depth:** place the FM melody deeper in the virtual room using synced delay (`delay` and `delaysync`) and reverberation (`room`), balanced with `gain`.

  Choose your own notes, rhythms, and spatial settings. Check your sketch against the rubric; the reference is one possible answer.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(116 / 4)
      stack(
        s("bd*2, ~ sd, hh*8").bank("RolandTR808"),
        note("<d3 c3 bb3 a3>").s("sawtooth").gain(0.65),
        note("<f4 a4 c5 e5>")
          .s("sine")
          .fmi(3.5)
          .fmh(2)
          .decay(0.15)
          .sustain(0)
          .delay(0.35)
          .delaysync(3 / 16)
          .room(0.4)
          .gain(0.45),
      )
    note: "One possible sketch. Dry drums and bass anchor the front of the mix, while FM plucks carry dotted-eighth echoes and a reverberant room wash."
listen_for:
  - "In the reference, a punchy, completely dry rhythm section anchors the mix upfront"
  - "Distinct metallic bell chimes move through F4, A4, C5, and E5"
  - "Echoes and reverberant tail place the melody in a wide virtual acoustic room"
rubric:
  - "Combines dry rhythm tracks with wet, spaced melodic tracks in stack"
  - "Rhythm section stays upfront and dry (no room or delay on drums and bass)"
  - "Melodic voice uses FM synthesis with fmi and fmh on a sine wave with a short pluck envelope"
  - "Melodic voice is placed in the background using delay (with delaysync) and room"
  - "All pitches are at or above C3"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: fmi
  - strudel-doc: fmh
  - strudel-doc: delay
  - strudel-doc: room
  - strudel-doc: delaysync
  - strudel-doc: bank
  - strudel-doc: gain
