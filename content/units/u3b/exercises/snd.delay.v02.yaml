id: snd.delay.v02
skills: [snd.delay]
type: describe-to-code
difficulty: 2
title: One clear echo
prompt: |
  Play **c4 e4 g4 c5** as plucks on a triangle wave (`decay` 0.1 seconds,
  nothing held). Give each pluck **a single clear echo an eighth note later**,
  a little quieter than the pluck. Keep the feedback low enough that the second
  echo is about 20 dB below the first.

  Any `delay` from about 0.4 to 0.7 fits the description. The reference uses
  one value in that range.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      note("c4 e4 g4 c5")
        .s("triangle")
        .decay(0.1)
        .sustain(0)
        .delay(0.6)
        .delaysync(1 / 8)
        .delayfeedback(0.1)
listen_for:
  - Every quarter-note pluck is answered by one echo on the eighth note after it, so the bar fills with even eighths
  - Hardly any further repeats. With feedback 0.1 the second echo is 20 dB below the first
  - "Feedback 0 is not the answer: at 0 the delay switches off entirely"
verify:
  cycles: 1
sources:
  - strudel-doc: delay
  - strudel-doc: delaysync
  - strudel-doc: delayfeedback
  - strudel-src: "packages/superdough/superdough.mjs#L929-L936"
  - lexicon: plucky
