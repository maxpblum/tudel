id: snd.putting-it-together-space.v02
skills: [snd.putting-it-together-space]
type: transform
difficulty: 2
title: "Adding a reverbed noise wash behind an FM groove"
prompt: |
  The starter provides a dry beat, bass, and an FM pluck. Add an airy,
  reverberant white-noise layer to the `stack`: `s("white*4")` highpassed
  with `.hpf(6000)`, with a short pluck envelope `.decay(0.1).sustain(0)`,
  placed in a wide space with `.room(0.55)` at `.gain(0.25)`.
starter: |
  setcpm(120 / 4)
  stack(
    s("bd ~ bd ~, ~ sd ~ sd").bank("RolandTR909"),
    note("<a3 f3 c3 g3>").s("sawtooth").gain(0.6),
    note("<a4 c5 e5 g4>")
      .s("sine")
      .fmi(2)
      .fmh(2)
      .decay(0.15)
      .sustain(0)
      .gain(0.4),
  )
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(120 / 4)
      stack(
        s("bd ~ bd ~, ~ sd ~ sd").bank("RolandTR909"),
        note("<a3 f3 c3 g3>").s("sawtooth").gain(0.6),
        note("<a4 c5 e5 g4>")
          .s("sine")
          .fmi(2)
          .fmh(2)
          .decay(0.15)
          .sustain(0)
          .gain(0.4),
        s("white*4").hpf(6000).decay(0.1).sustain(0).room(0.55).gain(0.25),
      )
listen_for:
  - "Solid TR-909 beat and bass in the center of the mix"
  - "Clear, bell-like FM pluck outlining A minor chords"
  - "Airy white-noise bursts floating in a distant, reverberant space"
verify:
  cycles: 4
sources:
  - strudel-doc: stack
  - strudel-doc: hpf
  - strudel-doc: room
  - strudel-doc: s
