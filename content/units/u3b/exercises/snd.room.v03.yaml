id: snd.room.v03
skills: [snd.room]
type: sweep
difficulty: 2
title: From dry to wet over four bars
prompt: |
  Play **c4 e4 g4 c5** as plucks on a triangle wave (`decay` 0.1 seconds,
  nothing held). Over four bars, move them from **dry** to **wet**: the reverb
  send steps through **0, 0.3, 0.6, 0.9**, one value per bar. Keep the default
  `roomsize`.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      note("c4 e4 g4 c5").s("triangle").decay(0.1).sustain(0).room("<0 0.3 0.6 0.9>")
listen_for:
  - Bar 1 sends nothing to the reverb (room 0). When the phrase repeats, only the tail left over from bar 4 rings into it
  - The tail grows a step at each barline, while the plucks themselves keep the same level
  - Only room is patterned. roomsize stays fixed, because a new roomsize rebuilds the shared reverb
verify:
  cycles: 4
sources:
  - strudel-doc: room
  - strudel-doc: roomsize
  - strudel-src: "packages/superdough/superdough.mjs#L938-L955"
  - strudel-src: "packages/superdough/superdoughoutput.mjs#L69-L93"
  - lexicon: wet
  - lexicon: plucky
