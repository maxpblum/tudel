id: rhy.rests-lengths.v01
skills: [rhy.rests-lengths]
type: dictation
difficulty: 2
title: Beethoven's motto, without the fermata
prompt: |
  The opening motto of Beethoven's Fifth Symphony (public domain), written
  here as one bar of 4/4. Play it on a **sawtooth** wave. Use `~` for the
  rest and `!` for the repeated G.

  Strudel has no fermata, so play the E-flat as a plain half note.
abc: |
  X:1
  M:4/4
  L:1/8
  K:Cm
  z G G G !fermata!E4 |
hide_reference_code_until_reveal: true
solutions:
  - code: |
      note("~ g4!3 eb4@4").s("sawtooth")
  - code: |
      note("~ g4 g4 g4 eb4@4").s("sawtooth")
    note: The same events. `g4!3` says "three times" without making the reader count.
listen_for:
  - An eighth of silence, then three quick Gs
  - The E-flat lasts exactly half the bar (eb4@4 is 4 of the 8 units)
  - "No held breath: the motto comes back exactly one bar later, where the score would pause"
verify:
  cycles: 1
  abc_agreement:
    voice: 0
    compare: [pitch, onset, duration]
sources:
  - strudel-src: "packages/mini/mini.mjs#L157-L158"
  - strudel-src: "packages/mini/krill.pegjs#L134-L135"
  - strudel-src: "packages/mini/krill.pegjs#L137-L145"
