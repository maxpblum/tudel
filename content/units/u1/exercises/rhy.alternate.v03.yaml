id: rhy.alternate.v03
skills: [rhy.alternate]
type: describe-to-code
difficulty: 2
title: Question and answer
prompt: |
  A two-bar phrase on a **triangle** wave, in C major. Both bars begin with
  the same three quarter notes, **e4 g4 f4**. Bar 1 asks a question: its last
  beat stays open on the second degree, **d4**. Bar 2 answers: its last beat
  closes on the tonic, **c4**. Write the shared notes only once.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      note("e4 g4 f4 <d4 c4>").s("triangle")
  - code: |
      note("<[e4 g4 f4 d4] [e4 g4 f4 c4]>").s("triangle")
    note: The same events, but the three shared notes are written twice.
listen_for:
  - Beats 1 to 3 are the same in both bars
  - Bar 1 ends on D, unresolved; bar 2 ends on C, at home
  - After the C the loop goes back to the question
verify:
  cycles: 2
sources:
  - strudel-src: "packages/mini/krill.pegjs#L122-L125"
  - strudel-src: "packages/mini/mini.mjs#L95-L96"
