id: rhy.drums.v01
skills: [rhy.drums]
type: dictation
difficulty: 2
title: An eighth-note beat on the 909
prompt: |
  Write this one-bar beat on the **TR-909**, `bank("RolandTR909")`. Bottom
  space: bass drum. Third space: snare. x above the staff: closed hi-hat.
  Every note is an eighth, one drum at a time.
abc: |
  X:1
  M:4/4
  L:1/8
  K:C clef=perc
  F !style=x!g c !style=x!g F F c !style=x!g |
hide_reference_code_until_reveal: true
solutions:
  - code: |
      s("bd hh sd hh bd bd sd hh").bank("RolandTR909")
listen_for:
  - Eight evenly spaced hits per bar, one drum on each
  - Kick on beat 1, and on beat 3 together with the eighth after it (two kicks in a row)
  - Snare on beats 2 and 4; hi-hat on the second half of beats 1, 2 and 4
verify:
  cycles: 1
  abc_agreement:
    voice: 0
    compare: [onset, duration]
sources:
  - strudel-doc: s
  - strudel-doc: bank
  - strudel-src: "website/src/pages/learn/samples.mdx#L25-L39"
