id: rhy.putting-it-together.v01
skills: [rhy.putting-it-together]
type: transform
difficulty: 2
title: "Interlocking Euclidean hi-hats over a beat"
prompt: |
  The starter gives a 1-bar kick and snare pattern on the TR-909. Add a
  third layer to the `stack`: a closed hi-hat playing five hits spread
  evenly over eight eighth-note slots (using `s("hh(5,8)")`), softened to
  `gain(0.5)`.
starter: |
  setcpm(120 / 4)
  stack(s("bd ~ bd ~"), s("~ sd ~ sd")).bank("RolandTR909")
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(120 / 4)
      stack(s("bd ~ bd ~"), s("~ sd ~ sd"), s("hh(5,8)").gain(0.5)).bank(
        "RolandTR909",
      )
listen_for:
  - "Kick on beats 1 and 3, snare on beats 2 and 4"
  - "Closed hi-hat playing 5 hits per bar spread across the 8 eighth-note positions"
  - "The hi-hat sits slightly lower in volume behind the kick and snare"
verify:
  cycles: 2
sources:
  - strudel-doc: stack
  - strudel-doc: euclid
  - strudel-doc: bank
