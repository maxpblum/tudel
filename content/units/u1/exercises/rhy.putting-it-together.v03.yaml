id: rhy.putting-it-together.v03
skills: [rhy.putting-it-together]
type: creative
difficulty: 2
title: "Micro-burst: 2-bar alternating drum ensemble"
prompt: |
  Compose an original 2-bar drum groove on the Roland TR-909 at 124 BPM using
  `stack` with three structural constraints:

  1. **Kick (`"bd"`):** establishes the pulse with an alternating pattern that differs across two bars using `< >`.
  2. **Snare (`"sd"`):** anchors the backbeat on beats 2 and 4, optionally adding ghost notes or syncopation.
  3. **Hi-hat (`"hh"`):** weaves through the pulse with an interlocking Euclidean rhythm (using `euclid` or mini-notation like `(5,8)`), softened with `gain` so it sits beneath the kick and snare.

  Choose the exact rhythms yourself. Check your groove against the rubric; the reference is one possible answer.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(124 / 4)
      stack(
        s("<[bd ~ bd ~] [bd ~ ~ bd]>"),
        s("~ sd ~ sd"),
        s("hh(5,8)").gain(0.5),
      ).bank("RolandTR909")
    note: "One possible groove. Kick alternates across two bars, snare marks beats 2 and 4, and Euclidean hats weave through the beat."
listen_for:
  - "In the reference, bar 1 has kick on beats 1 and 3; bar 2 shifts its second kick to the upbeat of beat 4"
  - "Snare hits solidly on beats 2 and 4 in every bar"
  - "Five hi-hat hits per bar weave around the drum pulses"
rubric:
  - "Uses stack to layer kick, snare, and hi-hat parts"
  - "Kick alternates across two bars using angle brackets < >"
  - "Snare marks the backbeat on beats 2 and 4"
  - "Hi-hat uses a Euclidean pattern softened with gain"
  - "Drum samples use the RolandTR909 bank"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: stack
  - strudel-doc: euclid
  - strudel-doc: bank
  - strudel-doc: gain
