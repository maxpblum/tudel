id: rhy.alternate.v04
skills: [rhy.alternate]
type: spec-to-code
difficulty: 2
title: A slow scale from one line
prompt: |
  Four bars of half notes on a **triangle** wave: **c4 d4 | e4 f4 | g4 f4 |
  e4 d4**. Write the eight notes as a single sequence and stretch it over
  four bars with `/`.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      note("[c4 d4 e4 f4 g4 f4 e4 d4]/4").s("triangle")
  - code: |
      note("<[c4 d4] [e4 f4] [g4 f4] [e4 d4]>").s("triangle")
    note: The same events. The `/4` form keeps the line in one piece, as a melody reads.
listen_for:
  - Two half notes per bar throughout
  - The line climbs from c4 to g4 and comes back down to d4 over four bars
  - After bar 4 it starts again on c4
verify:
  cycles: 4
sources:
  - strudel-src: "packages/mini/krill.pegjs#L150-L151"
  - strudel-doc: slow
