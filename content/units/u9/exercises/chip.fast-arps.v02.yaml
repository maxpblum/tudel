id: chip.fast-arps.v02
skills: [chip.fast-arps]
type: transform
difficulty: 2
title: From Alberti to frame speed
prompt: |
  The starter plays each chord as a broken-chord melody in eighth notes
  (positions 0 2 1 2, the Alberti figure). Change only the `arp` pattern so
  the line cycles **0 1 2** sixteen times per bar, fast enough to fuse into
  chords, while the chords still change **once per bar**.
starter: |
  setcpm(150 / 4)
  note("<[a3,c4,e4] [f3,a3,c4] [g3,b3,d4] [a3,c4,e4]>")
    .arp("0 2 1 2 0 2 1 2")
    .s("pulse")
    .gain(0.45)
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(150 / 4)
      note("<[a3,c4,e4] [f3,a3,c4] [g3,b3,d4] [a3,c4,e4]>")
        .arp("[0 1 2]*16")
        .s("pulse")
        .gain(0.45)
  - code: |
      setcpm(150 / 4)
      note("<[a3,c4,e4] [f3,a3,c4] [g3,b3,d4] [a3,c4,e4]>")
        .arp("0 1 2".fast(16))
        .s("pulse")
        .gain(0.45)
listen_for:
  - "48 notes per bar, 30 per second: you hear a chord, not a tune"
  - "Still Am, F, G, Am, one chord per bar"
  - "Code check: .fast(16) at the end of the whole line would be wrong: it would also cycle the chords 16 times per bar"
verify:
  cycles: 4
sources:
  - strudel-doc: arp
  - strudel-doc: fast
