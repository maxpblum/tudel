id: chip.ornaments.v04
skills: [chip.ornaments]
type: creative
difficulty: 3
title: Bring a plain tune to life
prompt: |
  Here is a plain four-bar tune in G major, the kind a game might play on
  its map screen:

  `note("<[g4 b4 d5 b4] [c5 e5 d5@2] [b4 d5 g5 f#5] [g5@4]>")`

  Ornament it for a 25 % pulse at about 140 BPM. Use **at least three
  different** ornaments from the lesson (grace notes, turns, trills, ply
  stutters, penv scoops or falls, vibrato, an echo channel with `off`), and
  place them the way a harpsichordist would: on strong beats, long notes and
  cadences, not everywhere. The reference is one possible answer.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      setcpm(140 / 4)
      note("<[[f#4 g4@3] b4 d5 b4] [c5 e5 [e5 d5 c#5 d5]@2] [b4 d5 g5 f#5] [g5@4]>")
        .s("pulse")
        .penv("<0 0 [0 0 -2 0] 0>")
        .pdecay(0.08)
        .vib(6)
        .vibmod("<0 0 0 0.3>")
        .gain(0.5)
        .off(1 / 8, (x) => x.gain(0.15).pw(0))
listen_for:
  - "A grace note F sharp into the opening G4"
  - "A turn around D5 in bar 2 in place of the held D5"
  - "A scoop into G5 on beat 3 of bar 3, the high point"
  - "Vibrato only on the long final G5"
  - "A quiet, hollow echo an eighth note behind the lead"
rubric:
  - "The original tune is still recognisable: same pitches on the strong beats, same bar grid"
  - "At least three different kinds of ornament"
  - "Ornaments sit on strong beats, long notes or cadences, not on every note"
  - "Grace notes and turns are written inside the step they decorate, so the beats don't move"
  - "If penv is used, pdecay is set explicitly"
  - "Every note at or above C3"
verify:
  cycles: 4
  equivalent_solutions: false
sources:
  - strudel-doc: penv
  - strudel-doc: vib
  - strudel-doc: "off"
  - lexicon: hollow
