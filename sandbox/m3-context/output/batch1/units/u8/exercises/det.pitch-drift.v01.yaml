id: det.pitch-drift.v01
skills: [det.pitch-drift]
type: describe-to-code
difficulty: 3
title: A worn cassette
prompt: |
  An eighth-note triangle line, **e4 g4 a4 c5 a4 g4 e4 d4**, that sounds as if
  it were played from a worn cassette: the pitch sags and recovers
  **irregularly**, never by more than about **20 cents** either way, and heads
  somewhere new about **every two bars**. Every note is still a clear,
  steady pitch; only the tuning from note to note wanders.
hide_reference_code_until_reveal: true
solutions:
  - code: |
      note("e4 g4 a4 c5 a4 g4 e4 d4")
        .add(note(perlin.range(-0.2, 0.2).slow(2)))
        .s("triangle")
listen_for:
  - "Irregular, smooth wandering with no repeating period: perlin, not sine"
  - "The whole line moves together; the intervals between neighbouring notes barely change"
  - "The very first note is 20 cents flat, because perlin starts at 0, the bottom of the range"
  - "No wobble inside a note: each note reads the drift once, at its onset"
  - 'If nothing drifts at all, check that the offset is wrapped in note(...): a bare number added to a note pattern is ignored'
verify:
  cycles: 8
sources:
  - strudel-doc: perlin
  - strudel-doc: add
  - strudel-src: "packages/core/value.mjs#L10-L18"
  - strudel-src: "packages/core/signal.mjs#L18-L21"
