units:
  - id: u3a
    title: Sound basics
    milestone: M1
    order: 3
    summary: "Build a synth voice from the source outward: pick a waveform, carve it
      with low-pass and high-pass filters, shape its articulation with an
      amplitude envelope and gain, and move the filter over bars."
  - id: u1
    title: Time & rhythm
    milestone: M2
    order: 1
    summary: "Hear and write time the Strudel way: one cycle is one bar, tempo is
      set with setcpm, and mini-notation divides, rests, lengthens, alternates
      and layers steps. Drums with s and bank, Euclidean rhythms, drum
      dictation."
  - id: u2
    title: Pitch, voices & harmony basics
    milestone: M2
    order: 2
    summary: Write pitch as scale degrees, build chords in one line, derive parallel
      voices with an interval offset, stack independent parts, and voice chord
      symbols with control over inversion and register.
  - id: u3b
    title: Sound, continued
    milestone: M2
    order: 4
    summary: "Extend the synth voice: filter envelopes and resonance, band-pass, FM
      and its envelope, noise, and the space effects room and delay."
  - id: u4
    title: Time & modulation
    milestone: M2
    order: 5
    summary: "Drive parameters with continuous signals: their shapes, ranges and
      speeds, stepping them with segment, organic drift with perlin, signals as
      melody, and sweeps aligned to bars and verses."
  - id: u5
    title: Advanced harmony & voicing
    milestone: M3
    order: 6
    summary: Harmonise a melody on the anchor with mode duck and offset, write
      seventh, sus and add9 chord symbols, build slash chords and pedal points
      from voicing plus a separate bass, borrow chords from the parallel minor,
      and play the four-chord loops of 80s pop.
  - id: u6
    title: Pattern transforms
    milestone: M3
    order: 7
    summary: "The contrapuntist's toolkit as code: diminution and augmentation with
      fast and slow, retrograde with rev and palindrome, canon with off,
      doubling with superimpose and jux, phrase-level variation with every,
      lastOf and when, melodic inversion by reflecting scale degrees, and
      repeated notes and imposed rhythms with ply and struct."
  - id: u7
    title: Layering & buses
    milestone: M3
    order: 8
    summary: "Mix several parts into one piece: route them to shared effect buses
      with orbit, give each part its own send into a shared delay or reverb, or
      its own space on a separate bus, place parts left to right with pan, and
      balance them and shape their dynamics with gain."
  - id: u8
    title: Detune & wobble
    milestone: M3
    order: 9
    summary: "Detuning as timbre and as out-of-tune: supersaw voices, detune in
      semitones and cents, beating, slow pitch drift with signals, vibrato, wide
      stereo pads, and an expressive 80s-style detuned lead."
  - id: u9
    title: Chiptune track
    milestone: M3
    order: 10
    summary: "Think like a game-console composer with four channels: pulse waves at
      their classic widths for lead and harmony, a triangle bass, drums made
      from noise bursts and pitch drops, arcade progressions with a semitone
      lift, chords played as frame-fast arpeggios on one channel, and the
      ornaments of 8-bit melody. Ends with a chiptune song project."
  - id: u10
    title: Synth-pop track
    milestone: M3
    order: 11
    summary: "Early-80s synth-pop with built-in sounds: drum-machine grooves on the
      808 and 909 with a big gated-style snare, pumping 16th-note sequenced
      bass, brass stabs shaped by a filter envelope, choir pads, string beds and
      arpeggiated beds, and short modal hooks over a four-chord loop. Ends with
      a synth-pop song project."
  - id: u11
    title: Synthwave track
    milestone: M3
    order: 12
    summary: "Outrun synthwave: a driving eighth-note filtered-saw bass, lush
      detuned supersaw pads, pumping made from gain that rises through each beat
      (signals, tremolo, then real ducking from the kick with duckorbit), and a
      soaring lead in synced echoes and a large room. Ends with a synthwave song
      project."
  - id: u12
    title: Form, arc & zen
    milestone: M3
    order: 13
    summary: "From loops to pieces: write a song's form as a list of named sections
      with arrange, stagger entrances with seqPLoop, shape the tension and
      release of a whole piece, refactor sprawling code until it reads like a
      score, and gather the course's idioms into one way of working."
skills:
  - id: snd.waveforms
    unit: u3a
    title: Choose a waveform
    prereqs: []
    summary: Play notes on the four built-in oscillators (sawtooth, square,
      triangle, sine) and hear how their harmonic content differs.
    vocabulary:
      - note
      - s
    lesson: snd.waveforms.lesson
    idiom_note: 'Say what, then with what: note(...) first, then .s(...). The sound
      name is just another pattern, so "<sawtooth square>" changes it per bar.'
  - id: snd.lowpass
    unit: u3a
    title: Low-pass filter and resonance
    prereqs:
      - snd.waveforms
    summary: Darken a bright waveform with lpf (cutoff in Hz) and add a resonant
      peak at the cutoff with lpq.
    vocabulary:
      - lpf
      - lpq
    lesson: snd.lowpass.lesson
    idiom_note: Start from a harmonically rich source (sawtooth or square) and
      subtract; a filter can only remove partials that are there.
  - id: snd.highpass
    unit: u3a
    title: High-pass filter
    prereqs:
      - snd.lowpass
    summary: Thin a sound out from below with hpf, and combine hpf with lpf to keep
      only a band of the spectrum.
    vocabulary:
      - hpf
    lesson: snd.highpass.lesson
    idiom_note: "Method order is for readers, not for the sound: the chain is always
      oscillator, amp envelope, gain, low-pass, high-pass. Write note, s,
      envelope, filters, then gain, the same way every time."
  - id: snd.amp-envelope
    unit: u3a
    title: Amplitude envelope and gain
    prereqs:
      - snd.lowpass
    summary: Shape articulation with attack, decay, sustain and release (or the adsr
      shorthand), and set dynamics and accents with gain.
    vocabulary:
      - attack
      - decay
      - sustain
      - release
      - adsr
      - gain
    lesson: snd.amp-envelope.lesson
    idiom_note: 'Set only the envelope stages you mean, and write sustain explicitly
      when it matters: .decay(0.2).sustain(0) says "pluck" more clearly than
      relying on an inferred default.'
  - id: snd.filter-sweep
    unit: u3a
    title: Filter sweeps over bars
    prereqs:
      - snd.lowpass
    summary: 'Move the cutoff over time: step it once per bar with "<...>", or glide
      it with a signal such as sine.range(a, b).slow(n).'
    vocabulary:
      - sine
      - saw
      - range
      - slow
    lesson: snd.filter-sweep.lesson
    idiom_note: 'Patterns go anywhere a number goes: put the change inside the
      parameter (.lpf("<400 800>") or .lpf(sine.range(400, 2000).slow(4)))
      instead of copying the line once per bar.'
  - id: rhy.cycles-tempo
    unit: u1
    title: Cycles, bars and tempo
    prereqs: []
    summary: Strudel counts time in cycles, and this course treats one cycle as one
      bar of 4/4. The steps of a string share the cycle equally, and setcpm(BPM
      / 4) sets the tempo.
    vocabulary:
      - setcpm
      - note
      - s
    lesson: rhy.cycles-tempo.lesson
    idiom_note: Write the tempo as setcpm(BPM / 4) on the first line, so a reader
      sees the beats per minute and the four beats per bar at once.
  - id: rhy.drums
    unit: u1
    title: Drum sounds and banks
    prereqs:
      - rhy.cycles-tempo
    summary: Play drum samples by their short names (bd, sd, hh, cp and so on) with
      s, and choose which drum machine's recordings to use with bank.
    vocabulary:
      - s
      - bank
    lesson: rhy.drums.lesson
    idiom_note: Write the rhythm with the plain drum names and set the machine once
      with .bank(...), instead of spelling RolandTR909_bd in every step.
  - id: rhy.subdivide
    unit: u1
    title: Subdivide with [ ] and *
    prereqs:
      - rhy.drums
    summary: "Fit several steps into the time of one with [ ], and repeat a step n
      times inside its own slot with *n: eighths, triplets, sixteenths and
      nested groups."
    vocabulary:
      - s
    lesson: rhy.subdivide.lesson
    idiom_note: Write a repeated note as *n (hh*8, c4*3) and different notes in one
      beat as [ ]; both mean "these share one step".
  - id: rhy.rests-lengths
    unit: u1
    title: "Rests, lengths and repeats: ~ @ !"
    prereqs:
      - rhy.subdivide
    summary: Leave a step silent with ~, give a step n units of length with @n, and
      repeat a step as n full steps with !n.
    vocabulary:
      - s
    lesson: rhy.rests-lengths.lesson
    idiom_note: "The bar never stretches: @ and ! share out a fixed cycle, so count
      the units in the string to know each note's value."
  - id: rhy.alternate
    unit: u1
    title: Alternate per bar with < > and /
    prereqs:
      - rhy.subdivide
    summary: Play one entry per cycle with <...>, placed only where the bars differ,
      and stretch a group that fills the bar over n cycles with /n.
    vocabulary:
      - s
    lesson: rhy.alternate.lesson
    idiom_note: Put < > around only the part that changes, as in "c4 e4 g4 <d5 c5>",
      so the material the bars share is written once.
  - id: rhy.layers
    unit: u1
    title: Layer parts with , and stack
    prereqs:
      - rhy.subdivide
    summary: Play sequences at the same time with a comma inside one string, or
      combine whole patterns with stack so that one method applies to all of
      them. Each layer divides the bar on its own, which gives polyrhythms.
    vocabulary:
      - stack
    lesson: rhy.layers.lesson
    idiom_note: "Use a comma for layers that share one sound setup, stack for
      patterns that share the methods after it, and one $: line per independent
      part."
  - id: rhy.euclid
    unit: u1
    title: Euclidean rhythms
    prereqs:
      - rhy.rests-lengths
    summary: Spread k hits as evenly as possible over n steps with (k,n), shift them
      later with a rotation (k,n,r), or use the euclid and euclidRot methods.
    vocabulary:
      - euclid
      - euclidRot
    lesson: rhy.euclid.lesson
    idiom_note: '"bd(3,8)" says "tresillo" in one word; spell out the rests only
      when the hits are not spread evenly.'
  - id: pit.scale-degrees
    unit: u2
    title: Scale degrees with n and scale
    prereqs:
      - snd.waveforms
      - rhy.subdivide
    summary: Write a melody as scale degrees counted from 0 with n, and name the
      key, scale and register once with scale("C4:major").
    vocabulary:
      - n
      - scale
    lesson: pit.scale-degrees.lesson
    idiom_note: "Write the tune as degrees and the key as one scale name: changing
      key is then a one-word edit, not a rewrite of every note."
  - id: pit.modes
    unit: u2
    title: Scales and modes per bar
    prereqs:
      - pit.scale-degrees
      - rhy.alternate
    summary: Choose major, minor, harmonic minor or a church mode by name, and
      switch the mode per bar with < > inside the scale name while the degree
      line stays the same.
    vocabulary:
      - scale
    lesson: pit.modes.lesson
    idiom_note: 'Pattern the scale, not the melody: scale("C4:<major minor>") gives
      modal mixture bar by bar from one unchanged degree line.'
  - id: pit.chords-mini
    unit: u2
    title: Chords in mini-notation
    prereqs:
      - pit.scale-degrees
      - rhy.layers
    summary: Write block chords as comma-separated notes or scale degrees inside one
      step, and invert them by moving a degree up or down an octave (7).
    vocabulary:
      - note
      - n
    lesson: pit.chords-mini.lesson
    idiom_note: Write diatonic chords as degrees, n("[0,2,4] [3,5,7]"), so the scale
      sets each chord's quality and a key change stays one word.
  - id: pit.parallel
    unit: u2
    title: Parallel voices from one line
    prereqs:
      - pit.chords-mini
    summary: "Derive parallel voices from one melodic line with add: degrees for
      diatonic thirds and sixths that follow the key, semitones for an exact
      interval."
    vocabulary:
      - add
    lesson: pit.parallel.lesson
    idiom_note: "Don't write the second voice: n(\"0 1 2 3\".add(\"0,-2\")) derives
      it, and the add goes inside n(...), before scale."
  - id: pit.polyphony
    unit: u2
    title: Independent parts with stack
    prereqs:
      - pit.chords-mini
      - rhy.layers
    summary: Combine independent lines, each with its own rhythm, scale and sound,
      into one contrapuntal texture with stack.
    vocabulary:
      - stack
    lesson: pit.polyphony.lesson
    idiom_note: "add for voices that move together, stack for parts that move on
      their own: one stack argument per part, each with its own s."
  - id: pit.chord-voicing
    unit: u2
    title: Chord symbols and voicing
    prereqs:
      - pit.chords-mini
      - rhy.alternate
    summary: Write harmony as lead-sheet chord symbols with chord, and let voicing
      realise each one as a piano voicing whose top note sits at or below C5.
    vocabulary:
      - chord
      - voicing
    lesson: pit.chord-voicing.lesson
    idiom_note: 'Name the harmony, not the notes: chord("<C Am F G>").voicing() is
      one line, where hand-spelled chords would need twenty note names.'
  - id: pit.register-inversion
    unit: u2
    title: Inversion and register control
    prereqs:
      - pit.chord-voicing
    summary: "Set the register and the inversion of a voiced chord: anchor picks the
      note to align to, and mode picks whether the top note (below), the bass
      (above) or a root-position voicing (root) meets it."
    vocabulary:
      - anchor
      - mode
    lesson: pit.register-inversion.lesson
    idiom_note: 'Steer voicing with anchor and mode instead of spelling notes:
      anchor the soprano with mode("below"), or the bass with mode("above").'
  - id: pit.progressions
    unit: u2
    title: Simple diatonic progressions
    prereqs:
      - pit.register-inversion
      - pit.modes
    summary: Turn Roman-numeral progressions in major and minor keys into chord
      symbols, one per bar, keep the top voice smooth with a fixed anchor, and
      add a root bass in scale degrees with stack.
    vocabulary:
      - chord
      - voicing
    lesson: pit.progressions.lesson
    idiom_note: One <...> of chord symbols is the whole progression; a fixed anchor,
      not voicing's memory, is what keeps the soprano smooth.
  - id: snd.filter-envelope
    unit: u3b
    title: Filter envelopes and resonance
    prereqs:
      - snd.amp-envelope
    summary: "Move the low-pass cutoff on every note: lpenv sets how many octaves it
      opens above lpf, and lpattack, lpdecay, lpsustain and lprelease shape the
      movement. With a high lpq the moving peak squelches."
    vocabulary:
      - lpenv
      - lpattack
      - lpdecay
      - lpsustain
      - lprelease
    lesson: snd.filter-envelope.lesson
    idiom_note: "lpf is the floor and lpenv the depth in octaves: let the envelope
      shape each note, and keep patterns and signals for change across bars."
  - id: snd.bandpass
    unit: u3b
    title: Band-pass filter
    prereqs:
      - snd.highpass
    summary: Keep one region of the spectrum with bpf (its centre, in Hz) and narrow
      it with bpq.
    vocabulary:
      - bpf
      - bpq
    lesson: snd.bandpass.lesson
    idiom_note: One bpf is clearer than an lpf and hpf pair when you mean "only this band".
  - id: snd.fm
    unit: u3b
    title: FM synthesis basics
    prereqs:
      - snd.amp-envelope
      - snd.filter-sweep
    summary: "Add partials to a sine with frequency modulation: fmh, the modulator's
      frequency ratio, picks which partials (whole numbers keep them harmonic),
      and fmi, the modulation index, how strong they are."
    vocabulary:
      - fmi
      - fmh
    lesson: snd.fm.lesson
    idiom_note: Put FM on a sine so you hear only what the modulator adds; choose
      the spectrum with fmh, then the brightness with fmi.
  - id: snd.fm-envelope
    unit: u3b
    title: FM envelopes
    prereqs:
      - snd.fm
    summary: Shape the modulation index over each note with fmattack, fmdecay and
      fmsustain, and choose the curve with fmenv, for struck, bell-like and
      brassy sounds.
    vocabulary:
      - fmenv
      - fmattack
      - fmdecay
      - fmsustain
    lesson: snd.fm-envelope.lesson
    idiom_note: Set only the FM stages you mean, and write fmsustain(0) for a struck
      sound whose brightness dies away.
  - id: snd.noise
    unit: u3b
    title: Noise sources
    prereqs:
      - snd.bandpass
      - snd.amp-envelope
    summary: Use white, pink and brown noise as sources with s, and add breath to a
      waveform with noise.
    vocabulary:
      - noise
      - s
    lesson: snd.noise.lesson
    idiom_note: Noise colours are sound names (s("pink")); breath on a pitched voice
      is a parameter (.noise(0.2)), shaped by the same envelope.
  - id: snd.room
    unit: u3b
    title: Reverb with room
    prereqs:
      - snd.amp-envelope
    summary: "Place a sound in a space: room sets how much is sent to the reverb,
      roomsize its decay time in seconds."
    vocabulary:
      - room
      - roomsize
    lesson: snd.room.lesson
    idiom_note: "Pattern room if the space should change, but set roomsize once per
      part: one reverb is shared, and a new roomsize rebuilds it."
  - id: snd.delay
    unit: u3b
    title: Tempo-synced delay
    prereqs:
      - snd.room
      - rhy.subdivide
    summary: Echo a sound in time with delay (send level), delaysync (echo spacing
      in cycles) and delayfeedback (how much each echo repeats).
    vocabulary:
      - delay
      - delaysync
      - delayfeedback
    lesson: snd.delay.lesson
    idiom_note: "Time echoes in cycles with delaysync, so they stay on the grid when
      the tempo changes: 3 / 16 is a dotted eighth in a 4/4 bar."
  - id: mod.signals
    unit: u4
    title: Signal shapes
    prereqs:
      - snd.filter-sweep
    summary: "Know the six basic signals (sine, cosine, saw, isaw, tri, square):
      each runs from 0 to 1 once per cycle, and they differ in where the bar
      starts and how the value moves."
    vocabulary:
      - sine
      - cosine
      - saw
      - isaw
      - tri
      - square
    lesson: mod.signals.lesson
    idiom_note: "Pick the shape for the start you want: on the downbeat sine is at
      its middle, cosine and isaw at the top, saw, tri and square at the
      bottom."
  - id: mod.range
    unit: u4
    title: Mapping signals with range
    prereqs:
      - mod.signals
    summary: Map a signal onto a parameter's values with range (even steps) or
      rangex (even ratios), and use rangex for frequencies so each octave gets
      equal time.
    vocabulary:
      - range
      - rangex
    lesson: mod.range.lesson
    idiom_note: "Sweep frequencies with rangex: the ear hears ratios, so a cutoff
      that doubles at an even rate sounds even, and a linear range rushes
      through the low octaves."
  - id: mod.signal-speed
    unit: u4
    title: "Signal speed: slow and fast"
    prereqs:
      - mod.signals
      - rhy.cycles-tempo
    summary: Set how many bars one sweep lasts with slow, or how many wobbles fit in
      a bar with fast, and give a fast signal enough notes to be heard.
    vocabulary:
      - slow
      - fast
    lesson: mod.signal-speed.lesson
    idiom_note: "A signal needs notes to carry it: each note reads it once, at its
      onset, so give every wobble at least four notes."
  - id: mod.segment
    unit: u4
    title: Stepping signals with segment
    prereqs:
      - mod.signal-speed
      - rhy.subdivide
    summary: Sample a continuous signal into n steps per cycle with segment, each
      step holding the value from its start, to make notes or stepped
      parameters.
    vocabulary:
      - segment
    lesson: mod.segment.lesson
    idiom_note: "Write segment last: it counts steps per cycle of whatever it
      follows, so saw.slow(4).segment(4) steps every beat, but
      saw.segment(4).slow(4) only every bar."
  - id: mod.perlin
    unit: u4
    title: Organic drift with perlin and rand
    prereqs:
      - mod.range
    summary: Add smooth random drift with perlin (a new level each cycle) and a
      fresh random value on every note with rand. Both repeat exactly on every
      playback.
    vocabulary:
      - perlin
      - rand
    lesson: mod.perlin.lesson
    idiom_note: 'Use perlin for drift and rand for scatter, and remember that both
      depend only on time: the same code gives the same "random" values every
      time.'
  - id: mod.signal-melody
    unit: u4
    title: Signals as melody
    prereqs:
      - mod.segment
      - pit.scale-degrees
    summary: "Turn a stepped signal into scale degrees with n and scale: the shape
      gives the contour, range the span in degrees, segment the notes per bar."
    vocabulary:
      - segment
      - scale
    lesson: mod.signal-melody.lesson
    idiom_note: 'Write the contour once and let scale choose the pitches:
      n(tri.range(0, 8).segment(8)).scale("C4:major") is an arch in eight
      notes.'
  - id: mod.phrase-sweeps
    unit: u4
    title: Sweeps over phrases and verses
    prereqs:
      - mod.signal-speed
      - rhy.alternate
    summary: Align sweeps to 4- and 8-bar phrases with slow, place the peak with the
      shape, and change the range per section with a patterned range.
    vocabulary:
      - slow
      - range
    lesson: mod.phrase-sweeps.lesson
    idiom_note: 'Slow the signal before you range it: saw.slow(8).range(300, "<1500
      4000>/8") changes the range every verse, because slow stretches everything
      written before it.'
  - id: pit.voicing-controls
    unit: u5
    title: "Harmonising a melody: anchor, duck and offset"
    prereqs:
      - pit.progressions
    summary: Put a melody on the anchor so it becomes each chord's top voice, remove
      the doubled melody note from the chord with mode("duck"), and try
      neighbouring dictionary voicings with offset, knowing that voicing has no
      memory of the chord before.
    vocabulary:
      - voicing
      - anchor
      - mode
      - offset
    lesson: pit.voicing-controls.lesson
    idiom_note: "The anchor is the soprano: give it the tune, add mode(\"duck\")
      when the tune also plays as its own part, and let the anchor, not
      voicing's memory, keep the top line smooth."
  - id: pit.extended-chords
    unit: u5
    title: Sevenths, sus and add9 chord symbols
    prereqs:
      - pit.progressions
    summary: Write major seventh (C^7), minor seventh (Dm7), dominant seventh, sus
      (Csus), 7sus and add9 chords in the spelling voicing's default dictionary
      accepts, and get a sus2 from spelled notes or from the sus4 a fifth
      higher.
    vocabulary:
      - chord
      - voicing
    lesson: pit.extended-chords.lesson
    idiom_note: "Spell chords the dictionary's way: ^7 for a major seventh and sus
      for a sus4; an unknown symbol plays nothing for that bar."
  - id: pit.slash-chords
    unit: u5
    title: Slash chords, inversions and pedal points
    prereqs:
      - pit.register-inversion
      - pit.extended-chords
    summary: Play inversion slash chords (C/E, Am/G) with mode("above") and the bass
      as the anchor, and foreign-bass chords and pedal points (F/G, G/C) as a
      voiced upper chord stacked over a separate bass line.
    vocabulary:
      - anchor
      - mode
      - stack
    lesson: pit.slash-chords.lesson
    idiom_note: 'A slash never goes inside chord(): anchor the bass with
      mode("above") when it is a chord tone, and give it its own part when it is
      not.'
  - id: pit.modal-mixture
    unit: u5
    title: "Modal mixture: chords from the parallel minor"
    prereqs:
      - pit.progressions
      - pit.modes
    summary: Borrow iv, ♭VI, ♭VII and ♭III from the parallel minor in a major key,
      hear the lowered degree each brings, and end a minor progression with a
      Picardy third.
    vocabulary:
      - chord
      - voicing
    lesson: pit.modal-mixture.lesson
    idiom_note: "Borrowing is a change of symbol, not of key: swap F for Fm, or add
      Ab and Bb, and the rest of the line stays as it is."
  - id: pit.genre-progressions
    unit: u5
    title: Four-chord loops of 80s pop
    prereqs:
      - pit.modal-mixture
      - pit.extended-chords
    summary: Play I–V–vi–IV, its rotation vi–IV–I–V, the minor-key reading
      i–♭VI–♭III–♭VII and the Aeolian vamp i–♭VII–♭VI–♭VII as one-bar chord
      loops over an eighth-note root bass, and colour them with sevenths, sus
      and add9.
    vocabulary:
      - chord
      - voicing
      - setcpm
    lesson: pit.genre-progressions.lesson
    idiom_note: A pop loop is one <...> of four symbols; rotate it, recolour it, or
      put a bass under it, and the rest of the song is arrangement.
  - id: pat.speed-dir
    unit: u6
    title: Diminution, augmentation and retrograde
    prereqs:
      - mod.signal-speed
      - pit.scale-degrees
    summary: Play a melody in halved or doubled note values with fast and slow,
      backwards with rev (each bar reversed in place), and forwards and
      backwards in alternate bars with palindrome.
    vocabulary:
      - fast
      - slow
      - rev
      - palindrome
    lesson: pat.speed-dir.lesson
    idiom_note: "Write the subject once and transform it: .fast(2) is diminution,
      .slow(2) augmentation, .rev() retrograde. Copying the notes out again by
      hand hides that the lines are the same."
  - id: pat.canon-imitation
    unit: u6
    title: Canon and imitation with off
    prereqs:
      - pat.speed-dir
      - pit.parallel
    summary: "Build a canon from one line: off(time, f) plays the line together with
      a copy delayed by time cycles and changed by f, such as a transposition in
      degrees for a canon at the octave or the fifth."
    vocabulary:
      - off
    lesson: pat.canon-imitation.lesson
    idiom_note: 'A round is one line plus one off: n("…".off(2, (x) => x.add(7))).
      Do the add on the degrees inside n(...), where it changes the pitch.'
  - id: pat.superimpose
    unit: u6
    title: Doubling with superimpose, answering with jux
    prereqs:
      - pat.canon-imitation
    summary: Layer a changed copy of a line on top of it with no delay, as in
      orchestral doubling (superimpose), or split the original and the copy to
      the left and right speakers (jux).
    vocabulary:
      - superimpose
      - jux
    lesson: pat.superimpose.lesson
    idiom_note: superimpose is off without the delay. Reach for it when the copy
      needs its own rhythm or sound; a plain interval is shorter as add("0,7").
  - id: pat.variation-every
    unit: u6
    title: "Phrase-level variation: every, lastOf and when"
    prereqs:
      - pat.speed-dir
      - rhy.alternate
    summary: "Change a loop in chosen bars only: every (the same as firstOf) on the
      first bar of each group of n bars, lastOf on the last bar, and when
      wherever a pattern of 1s and 0s says 1, even within a bar."
    vocabulary:
      - every
      - firstOf
      - lastOf
      - when
    lesson: pat.variation-every.lesson
    idiom_note: "A phrase-ending variation is lastOf(4, …), not every(4, …): every
      changes bar 1 of each group, the downbeat of the phrase."
  - id: pat.inversion-idiom
    unit: u6
    title: Melodic inversion by reflecting degrees
    prereqs:
      - pat.speed-dir
      - pit.parallel
    summary: Turn a melody upside down by reflecting its scale degrees about an axis
      with mul(-1) and add (tonal inversion), or its note numbers in semitones
      (real inversion), and combine it with rev for the retrograde inversion.
    vocabulary:
      - mul
    lesson: pat.inversion-idiom.lesson
    idiom_note: "Inversion is arithmetic: \"…\".mul(-1).add(2 × axis) on the
      degrees. Strudel's invert flips 1s and 0s in a rhythm and does not touch
      pitch."
  - id: pat.ply-struct
    unit: u6
    title: "Repeated notes and imposed rhythm: ply and struct"
    prereqs:
      - pat.speed-dir
      - rhy.rests-lengths
      - pit.chord-voicing
    summary: Repeat every note n times inside its own length with ply (where fast
      repeats the whole bar), and give a pattern a new rhythm with struct; flip
      a rhythm of 1s and 0s with invert for an interlocking hocket.
    vocabulary:
      - ply
      - struct
      - invert
    lesson: pat.ply-struct.lesson
    idiom_note: ply(2) repeats each note, fast(2) repeats the bar. Write the rhythm
      once with struct and let the harmony change underneath it.
  - id: bus.stereo-pan
    unit: u7
    title: Stereo placement with pan
    prereqs:
      - pit.polyphony
      - mod.range
      - pat.speed-dir
    summary: Seat each part between the two speakers with pan (0 left, 0.5 centre, 1
      right), alternate sides with a pattern, or move a part across the stereo
      field with a signal. jux as a one-line stereo crab canon (the line against
      its own retrograde).
    vocabulary:
      - pan
      - jux
    lesson: bus.stereo-pan.lesson
    idiom_note: "Give each $: part its own seat with one .pan(...) at the end of its
      chain; a pattern moves it by steps, a signal sweeps it, and short notes
      make the sweep audible."
  - id: bus.mixing-balance
    unit: u7
    title: Balance and dynamics with gain
    prereqs:
      - snd.amp-envelope
      - pit.polyphony
      - mod.range
    summary: Read gain in decibels (each halving is 6 dB down), set a hierarchy of
      parts below the melody, keep the sum from overloading, and write terraced
      dynamics with < > and hairpins with signals.
    vocabulary:
      - gain
      - postgain
    lesson: bus.mixing-balance.lesson
    idiom_note: "Balance in decibels, not by eye: set the melody first, then place
      every other part a stated number of dB below it, and use rangex for a
      crescendo that grows evenly."
  - id: bus.orbit
    unit: u7
    title: Effect buses with orbit
    prereqs:
      - snd.room
      - snd.delay
      - rhy.layers
    summary: "An orbit is a shared effect bus: one delay and one reverb that every
      part on it feeds. All parts use orbit 1 unless told otherwise, so parts
      that disagree about delaysync or roomsize must go to separate orbits."
    vocabulary:
      - orbit
      - stack
    lesson: bus.orbit.lesson
    idiom_note: "Parts that need different echo times or room sizes get different
      orbits; write orbit once after stack for parts that share a space, or on
      each $: line for parts that don't."
  - id: bus.shared-effects
    unit: u7
    title: "Shared spaces: send levels and separate buses"
    prereqs:
      - bus.orbit
      - bus.mixing-balance
    summary: Put the parts of one ensemble in one space with one shared reverb and
      delay, set how far back each part sits with its own send level, and give a
      part that belongs somewhere else its own orbit.
    vocabulary:
      - room
      - roomsize
      - delay
      - delaysync
      - orbit
    lesson: bus.shared-effects.lesson
    idiom_note: Write the space once (roomsize, delaysync after one stack on one
      orbit) and vary only the sends (room, delay) per part.
  - id: det.supersaw
    unit: u8
    title: "Supersaw: unison voices and detune"
    prereqs:
      - snd.waveforms
    summary: 'Play a note on several sawtooth voices at once with "supersaw": unison
      sets how many, detune sets the total spread from lowest to highest voice
      in semitones (0.1 = 10 cents). Small spreads shimmer; large ones sound out
      of tune.'
    vocabulary:
      - detune
      - unison
    lesson: det.supersaw.lesson
    idiom_note: "Think of detune in cents: detune(0.1) is 10 cents from the lowest
      voice to the highest. Always set it explicitly, and write pitches with
      note, because an unset detune reads n instead."
  - id: det.pitch-drift
    unit: u8
    title: Pitch drift and vibrato
    prereqs:
      - det.supersaw
      - mod.perlin
      - mod.signal-speed
      - pit.parallel
    summary: Let the pitch wander slowly by adding a signal wrapped in note(...),
      which each note reads at its onset, and make it waver inside every note
      with vib (rate in Hz) and vibmod (depth in semitones).
    vocabulary:
      - add
      - vib
      - vibmod
    lesson: det.pitch-drift.lesson
    idiom_note: "Wrap the offset in note: .add(note(sine.range(-0.15,
      0.15).slow(4))) drifts, while .add(sine...) on a note pattern does
      nothing. Drift picks a pitch per note; vib moves it inside the note."
  - id: det.chorus-detune
    unit: u8
    title: Wide detuned pads
    prereqs:
      - det.supersaw
      - det.pitch-drift
      - snd.amp-envelope
    summary: 'Spread detuned voices across the stereo field: spread on "supersaw",
      or detuned copies of any sound with superimpose and pan, or jux for hard
      left and right. The chorus control does nothing in this engine.'
    vocabulary:
      - spread
      - superimpose
      - jux
      - pan
    lesson: det.chorus-detune.lesson
    idiom_note: "Width comes from copies that are nearly, but not quite, the same:
      detune them a few cents and send them to different sides. Set the
      original's pan before superimpose, and the copy's inside it."
  - id: det.detuned-lead
    unit: u8
    title: An 80s detuned lead
    prereqs:
      - det.chorus-detune
      - snd.filter-envelope
      - snd.delay
      - pit.chords-mini
    summary: "Build an 80s analog-style lead and arpeggio: two or three slightly
      detuned voices, broken chords with arp, a plucky filter envelope, a synced
      echo, and a little drift and vibrato on the melody."
    vocabulary:
      - arp
    lesson: det.detuned-lead.lesson
    idiom_note: "Pads take many wide voices, leads take few narrow ones: unison(2)
      with detune(0.12) keeps the pitch clear and still beats. Let arp read the
      chord and keep the chord in one place."
  - id: chip.pulse-channels
    unit: u9
    title: Pulse waves and the four-channel band
    prereqs:
      - snd.waveforms
      - snd.amp-envelope
      - pit.polyphony
      - bus.mixing-balance
    summary: "Play the pulse oscillator at the classic console widths (50 %, 25 %,
      12.5 %) with pw, sweep the width with pwrate and pwsweep, and plan a piece
      for four monophonic channels: two pulses, a triangle bass and noise."
    vocabulary:
      - pw
      - pwrate
      - pwsweep
    lesson: chip.pulse-channels.lesson
    idiom_note: "One $: line per channel, one note at a time per line. Writing to
      the console's four-channel limit is a style choice in Strudel, and it is
      what makes the result sound like a game."
  - id: chip.noise-drums
    unit: u9
    title: Chip drums from noise and pitch drops
    prereqs:
      - chip.pulse-channels
      - snd.noise
      - snd.highpass
      - rhy.layers
    summary: "Build a drum kit with no samples: hi-hats and snares from white-noise
      bursts with a fast decay, and a kick from a triangle whose pitch drops
      several octaves in a few hundredths of a second with penv and pdecay."
    vocabulary:
      - penv
      - pdecay
      - decay
      - sustain
    lesson: chip.noise-drums.lesson
    idiom_note: "A drum is an envelope: decay with sustain(0) decides how long each
      hit lasts. Write the kit as one channel per drum with $: and let the
      mini-notation carry the groove."
  - id: chip.arcade-harmony
    unit: u9
    title: "Arcade progressions: bVI-bVII-I and the semitone lift"
    prereqs:
      - pit.modal-mixture
      - pit.genre-progressions
      - chip.pulse-channels
    summary: "The harmonic stock of game music: the Aeolian loop i-bVI-bVII, the
      borrowed bVI-bVII-I victory cadence, and the final-lap modulation up a
      semitone with transpose."
    vocabulary:
      - chord
      - voicing
      - transpose
    lesson: chip.arcade-harmony.lesson
    idiom_note: Modulate the whole loop with one transpose("<0 0 0 1>") at the end
      of the line instead of rewriting every note in the new key.
  - id: chip.fast-arps
    unit: u9
    title: "Fast arpeggios: a whole chord on one channel"
    prereqs:
      - chip.pulse-channels
      - det.detuned-lead
      - pat.speed-dir
    summary: Play a chord on a single monophonic channel by cycling its notes so
      fast (twenty or more per second) that the ear fuses them into one
      shimmering chord, and contrast that with a broken chord slow enough to
      hear as a melody.
    vocabulary:
      - arp
      - fast
    lesson: chip.fast-arps.lesson
    idiom_note: 'Keep the chord in the note pattern and the speed in the arp
      pattern: note("<[c4,e4,g4] ...>").arp("[0 1 2]*8") changes chords once per
      bar however fast the arpeggio runs.'
  - id: chip.ornaments
    unit: u9
    title: "Arcade ornaments: grace notes, trills, slides and the echo channel"
    prereqs:
      - chip.fast-arps
      - pat.canon-imitation
      - det.pitch-drift
    summary: "Decorate an 8-bit melody the way game composers did: grace notes and
      trills in mini-notation, repeated-note stutters with ply, pitch scoops and
      drops with penv, vibrato with vib, and a quieter delayed copy of the lead
      with off, the channel-borrowing echo."
    vocabulary:
      - ply
      - penv
      - vib
      - off
    lesson: chip.ornaments.lesson
    idiom_note: "Ornament the written line, not a copy of it: put grace notes inside
      the step they decorate (\"[b4 c5@3]\") so the bar's grid stays intact."
  - id: chip.project
    unit: u9
    title: Chiptune song project
    prereqs:
      - chip.noise-drums
      - chip.arcade-harmony
      - chip.ornaments
    summary: "Build a complete looping game cue, channel by channel: a noise and
      pitch-drop drum kit, a triangle bass, an arpeggiated pulse harmony and an
      ornamented pulse lead, mixed within the four-channel limit."
    vocabulary:
      - pw
      - arp
      - penv
    lesson: chip.project.lesson
    idiom_note: "Build in checkpoints and keep every channel playing while you add
      the next: a project that sounds right at each step is easier to finish."
  - id: spop.drum-machine
    unit: u10
    title: Drum-machine grooves on the 808 and 909
    prereqs:
      - rhy.drums
      - rhy.layers
      - bus.mixing-balance
      - bus.orbit
    summary: "Program early-80s drum-machine patterns: four-on-the-floor and
      backbeat grooves, accented sixteenth-note hats with a gain pattern, claps
      and open hats, and a big gated-style snare from a short, loud reverb on
      its own orbit."
    vocabulary:
      - bank
      - gain
      - orbit
      - roomsize
    lesson: spop.drum-machine.lesson
    idiom_note: Accents are a gain pattern laid over the hits ("1 0.5 0.7 0.5"), not
      extra sounds. The machine plays every step at the same strength, so the
      groove lives in that pattern.
  - id: spop.sequenced-bass
    unit: u10
    title: Pumping 16th-note sequenced bass
    prereqs:
      - snd.filter-envelope
      - pat.ply-struct
      - pit.genre-progressions
    summary: "Write the sequencer bass of synth-pop: one root per bar repeated as
      sixteenths with ply, octave jumps added as a pattern of note offsets, and
      a short filter envelope that makes every note tick."
    vocabulary:
      - ply
      - lpenv
      - lpdecay
    lesson: spop.sequenced-bass.lesson
    idiom_note: 'Write the roots once, one per bar, and let ply make the sixteenths:
      note("<c3 ab3 eb3 bb3>").ply(16). The harmony stays readable at a glance.'
  - id: spop.brass-stabs
    unit: u10
    title: Synth brass stabs
    prereqs:
      - snd.filter-envelope
      - pat.ply-struct
      - pit.extended-chords
    summary: "Make polysynth brass from sawtooth chords: a short attack, a filter
      envelope that opens on each onset like a brass player's lips, and short,
      syncopated chord hits placed with struct."
    vocabulary:
      - lpenv
      - lpattack
      - attack
      - struct
    lesson: spop.brass-stabs.lesson
    idiom_note: "The brass character comes from the filter's attack, not the
      amplitude's: let lpattack open the tone over a few hundredths of a second
      while the amplitude is already there."
  - id: spop.pads
    unit: u10
    title: Choir pads, string beds and arpeggiated beds
    prereqs:
      - det.chorus-detune
      - pit.voicing-controls
      - snd.bandpass
      - det.detuned-lead
    summary: "Lay down the harmonic bed of a synth-pop song: a choir pad from vowel
      formants on sawtooth chords, a string-machine bed from slow-attack detuned
      supersaws, and a moving bed that arpeggiates the same chords."
    vocabulary:
      - vowel
      - attack
      - release
      - arp
    lesson: spop.pads.lesson
    idiom_note: Use one chord line for every bed. Voice it with chord(...).voicing()
      and anchor, and change the sound around it, so the choir, strings and
      arpeggio all follow the same harmony.
  - id: spop.hooks
    unit: u10
    title: "Modal hooks: the riff over the loop"
    prereqs:
      - pit.modes
      - pat.variation-every
      - spop.sequenced-bass
    summary: Write a short, repeating synth riff with a modal colour (Aeolian,
      Dorian or Mixolydian) over a four-chord loop, and vary it at the end of
      each phrase with lastOf.
    vocabulary:
      - scale
      - lastOf
    lesson: spop.hooks.lesson
    idiom_note: Write the hook in scale degrees with n and scale, so swapping the
      mode name ("C4:dorian" for "C4:minor") changes its colour without touching
      the rhythm.
  - id: spop.project
    unit: u10
    title: Synth-pop song project
    prereqs:
      - spop.drum-machine
      - spop.brass-stabs
      - spop.pads
      - spop.hooks
    summary: "Build an eight-bar synth-pop loop in checkpoints: drum machine, 16th
      bass, a pad or string bed with brass stabs, and a modal hook, balanced
      across orbits."
    vocabulary:
      - bank
      - ply
      - lpenv
      - vowel
    lesson: spop.project.lesson
    idiom_note: "Give each part its own $: line and its own orbit when its space
      differs. Then balance with gain only after every part is in."
  - id: swave.rolling-bass
    unit: u11
    title: Driving eighth-note bass
    prereqs:
      - spop.sequenced-bass
    summary: Drive a synthwave track with a filtered sawtooth playing steady eighth
      notes on the chord roots, octave pulses, and the galloping sixteenth
      variant that leaves the beat free for the kick.
    vocabulary:
      - lpf
      - lpenv
      - struct
    lesson: swave.rolling-bass.lesson
    idiom_note: "Keep the bass's rhythm in one place: roots in \"< >\", rhythm in
      ply or struct. Changing \"x*8\" to \"[~ x x x]*4\" turns a drive into a
      gallop without touching the harmony."
  - id: swave.pads
    unit: u11
    title: Lush detuned pad beds
    prereqs:
      - det.chorus-detune
      - pit.extended-chords
      - bus.shared-effects
      - mod.phrase-sweeps
    summary: "Build the warm wall of synthwave: seventh and add9 chords on a
      many-voiced supersaw with moderate detune, a slow attack and long release,
      a filter that breathes over a phrase, and a large reverb on its own
      orbit."
    vocabulary:
      - detune
      - unison
      - spread
      - roomsize
    lesson: swave.pads.lesson
    idiom_note: Put the pad on its own orbit with its own roomsize, so its long hall
      doesn't rebuild or fight the shorter room of the drums.
  - id: swave.pump
    unit: u11
    title: "Pumping: gain that breathes with the beat"
    prereqs:
      - swave.pads
      - mod.segment
      - bus.mixing-balance
    summary: "Make a pad pump with the beat: gain that starts low on every beat and
      rises before the next, first as a signal on re-triggered sixteenths with
      segment, then as a continuous tremolo locked to the bar with tremolosync."
    vocabulary:
      - segment
      - gain
      - tremolosync
      - tremolodepth
    lesson: swave.pump.lesson
    idiom_note: "A signal needs notes to carry it: gain(saw...) only changes at note
      onsets, so chop a held pad with segment(16) or use tremolosync for a truly
      continuous swell."
  - id: swave.sidechain
    unit: u11
    title: Sidechain ducking from the kick
    prereqs:
      - swave.pump
      - bus.orbit
    summary: Duck a whole bus each time the kick plays with duckorbit, set how deep
      and how fast it recovers with duckdepth and duckattack, and choose between
      ducking and a pre-drawn gain pump.
    vocabulary:
      - duckorbit
      - duckdepth
      - duckattack
    lesson: swave.sidechain.lesson
    idiom_note: Put the parts that should pump on their own orbit and let the kick
      duck that orbit. The kick's own orbit, and anything else on it, stays
      untouched.
  - id: swave.lead
    unit: u11
    title: "A soaring lead: synced echoes and a big room"
    prereqs:
      - det.detuned-lead
      - bus.shared-effects
      - det.pitch-drift
      - chip.ornaments
    summary: "Write a long-breathed synthwave lead: a sawtooth or two-voice supersaw
      with a gentle attack and vibrato, a dotted-eighth echo with delaysync and
      delayfeedback, a long hall on its own orbit, and an octave doubling for
      the climax."
    vocabulary:
      - delaysync
      - delayfeedback
      - room
      - vib
    lesson: swave.lead.lesson
    idiom_note: Write the lead's long notes long (@ in mini-notation) and let the
      echo fill the space between phrases; the rests are part of the line.
  - id: swave.project
    unit: u11
    title: Synthwave song project
    prereqs:
      - swave.rolling-bass
      - swave.sidechain
      - swave.lead
    summary: "Build an eight-bar synthwave cue in checkpoints: drums, rolling bass,
      a pumping detuned pad, and a soaring lead in echoes and reverb, each on
      the right orbit."
    vocabulary:
      - detune
      - duckorbit
      - delaysync
      - orbit
    lesson: swave.project.lesson
    idiom_note: "Decide the orbits before the sounds: one for drums, one for the
      parts that pump, one for the lead's hall. The mix then follows from the
      plan."
  - id: zen.section-arrange
    unit: u12
    title: Song sections in order with arrange
    prereqs:
      - rhy.alternate
      - rhy.layers
      - pit.genre-progressions
    summary: "Play whole sections one after another with arrange: name each section
      as a stack of parts, list the form with a length in bars for each, and
      know that every section starts from its own first bar when it enters."
    vocabulary:
      - arrange
      - stack
      - silence
    lesson: zen.section-arrange.lesson
    idiom_note: "Name the sections, then write the form once at the bottom:
      arrange([4, verse], [4, chorus]) reads like a road map. Make each
      section's length a multiple of every < > inside it, so each pass sounds
      the same."
  - id: zen.loop-layering
    unit: u12
    title: Staggered entrances with seqPLoop
    prereqs:
      - zen.section-arrange
      - pat.canon-imitation
    summary: "Give each part a window of bars with seqPLoop, so parts can enter and
      leave independently and overlap: a build-up, a fugal exposition, a
      thinning outro. Know that windows follow the song's bar count, and that
      the last entry written sets the loop's length."
    vocabulary:
      - seqPLoop
      - mask
    lesson: zen.loop-layering.lesson
    idiom_note: "seqPLoop is the cue sheet: one row per part, [start, end, part],
      all in one place. Write the entry that ends last at the bottom, because
      its end sets the length of the loop."
  - id: zen.dramatic-arc
    unit: u12
    title: "Shaping the arc: tension and release across sections"
    prereqs:
      - zen.section-arrange
      - mod.phrase-sweeps
      - bus.mixing-balance
      - chip.arcade-harmony
    summary: "Plan a piece's intensity section by section and realise it with the
      dimensions you already control: density, register, brightness, loudness,
      harmony and key. Build tension with a riser and a dominant pedal, release
      it at the return, and lift the last chorus a semitone."
    vocabulary:
      - arrange
      - rangex
      - transpose
      - gain
      - lpf
    lesson: zen.dramatic-arc.lesson
    idiom_note: "Change several dimensions together and save the most for the end: a
      section-length riser written as saw.slow(4) inside a 4-bar section always
      starts at the section's first bar, because arrange restarts each section's
      clock."
  - id: zen.readability-refactor
    unit: u12
    title: Refactoring a sprawling piece into a readable score
    prereqs:
      - zen.section-arrange
      - zen.loop-layering
      - pat.variation-every
    summary: "Recognise the signs of sprawling Strudel code (copied lines, long mask
      strings, the same fact written three times, nested callbacks, unexplained
      numbers) and rewrite it so its layout mirrors the music: named parts,
      named sections, the form at the bottom."
    vocabulary:
      - arrange
      - seqPLoop
      - stack
      - lastOf
    lesson: zen.readability-refactor.lesson
    idiom_note: "One fact in one place: write the chord loop, the tempo and each
      part's sound once, give them names, and derive everything else from the
      names. If you have to change a fact in two places, the code isn't
      finished."
  - id: zen.consolidated-idioms
    unit: u12
    title: "The zen of Strudel: the course's idioms in one piece"
    prereqs:
      - zen.dramatic-arc
      - zen.readability-refactor
      - chip.project
      - spop.project
      - swave.project
    summary: "Bring the course's idioms together as a few principles for live
      coding: say what, then with what; patterns go anywhere a number goes;
      write once and derive; steps with < >, sweeps with signals; one part per
      line, one space per orbit; time in cycles; the form at the bottom; balance
      last."
    vocabulary:
      - setcpm
      - voicing
      - scale
      - orbit
      - arrange
    lesson: zen.consolidated-idioms.lesson
    idiom_note: "Good live code is written for the next edit: every musical decision
      lives in one obvious place, so a key change, a new section or a quieter
      pad is a one-word change made while the music keeps playing."
